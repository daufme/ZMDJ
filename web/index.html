<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阵面对决 · 测试台</title>
<style>
  :root{
    --mat:#7a4f26; --mat2:#93602f; --line:#5b3c1c;
    --ink:#2b1c0e; --cream:#f7f1e2; --cream2:#eee4cf;
    --p0:#2f7d4f; --p1:#a83232; --accent:#ffd479; --dim:#d8c39a; --bad:#e07070;

    /* ── 卡尺寸：**只定高度**，宽度由卡图比例算出来（484:682 ≈ 0.71）──────────
       所有地方的牌都用这一套，改一处就整体缩放。上下限防止极端窗口下太小/太大。
       阵地故意比其它区域**小**（它占的是最宝贵的横向空间，一行五个）。 */
    --卡比: 484 / 682;
    --卡高-阵地: clamp(76px, 8.6vh, 116px);    /* 阵地：比其它区域**小**（一行五个，横向最挤） */
    --卡高-区域: clamp(84px, 10.2vh, 138px);   /* 手牌/墓地/牌库/放逐区：比阵地大 */
    --卡高-堆叠: clamp(48px, 6.2vh, 84px);
    --卡高-查看: clamp(104px, 14vh, 176px);    /* 查看器里最大（要看清楚） */
    /* 半场两侧的牌库/墓地那一栏的宽度 */
    --侧栏宽: clamp(92px, 8.6vw, 132px);
    /* 左栏（放逐区 + 堆叠）的宽度 */
    --左栏宽: clamp(126px, 11vw, 196px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{ margin:0; color:#f3ead8; font:12px/1.4 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
        background:radial-gradient(circle at 30% -10%, #57351a, #241407 65%) #241407; }
/* 顶栏已经拆进左右栏了，这里只剩 .wrap 一个孩子 */
  #app{ height:calc(100vh / var(--缩放, 1)); display:flex; flex-direction:column; padding:6px 8px; gap:6px; }
/* ── 手机（横屏原样）────────────────────────────────────────────────
   桌面这套是 1280 宽、三栏的密集布局 ✓；手机不做重排（用户定：**原样横屏就行** ✓），
   而是整体等比缩小（脚本设 `body.zoom` ✓）→ 版式一模一样 ✓，只是字小一点 ✓。
   竖屏时提示转屏 ✓（横屏才好玩 ✓）。 */
#转屏提示{ display:none; position:fixed; inset:0; z-index:99; background:var(--panel);
  color:var(--ink); align-items:center; justify-content:center; text-align:center; font-size:20px; line-height:1.8; }
body.竖屏 #转屏提示{ display:flex; }
/* 窄屏时把查看器/面板的内边距收一点 ✓（缩过之后更省地方） */
@media (max-width:820px){
  .viewer{ padding:6px !important; }
  .opbar{ padding:4px 6px !important; gap:4px !important; }
  .act{ padding:3px 6px !important; font-size:12px !important; }
}
  /* 按钮：**一套样式**。原来基础样式是深棕渐变，而 .大厅 button 是亮金色 ——
     同一个界面里两种观感，战场里的按钮看着像「黑着不能点」。统一成亮的。 */
  button{ background:linear-gradient(#8a5a28,#633d16); color:#fff3dd; border:1px solid #a8834a;
          border-radius:5px; padding:3px 8px; cursor:pointer; font:inherit;
          box-shadow:0 1px 2px rgba(0,0,0,.35); }
  button:hover{ border-color:var(--accent); color:#fff; background:linear-gradient(#9a6630,#70461a); }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button.on{ border-color:#ffe9a8; color:#2b1c0e; background:linear-gradient(#ffd479,#e8b455); font-weight:700; }
  .dim{ color:var(--dim); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  /* 顶栏：**拆成左右两半**，各自待在自己那一栏的顶部。
     中间什么都不放 —— 战场（board）因此能从**最顶上**开始，多出一整条顶栏的高度。
     （<header> 这个标签现在只有组牌面板在用。） */
  .topbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:28px; flex:none;
           background:linear-gradient(#4a2d14,#331e0c); border:1px solid var(--line);
           border-radius:6px; padding:3px 8px; font-size:11px; }
  .topbar b{ color:var(--accent); font-size:12px; }
  .topbar .spacer{ flex:1; }
  header{ display:flex; gap:10px; align-items:center; height:30px; flex:none;
          background:linear-gradient(#4a2d14,#331e0c); border:1px solid var(--line);
          border-radius:6px; padding:0 10px; }
  header b{ color:var(--accent); font-size:13px; }
  header .spacer{ flex:1; }

  /* 三栏：左（放逐区 + 堆叠）| 中（战场）| 右（详情 + 日志）
     放逐区和堆叠挪到左边之后，中间只留两个半场，横向空间全给阵地。 */
  .wrap{ flex:1; display:grid; grid-template-columns:var(--左栏宽) 1fr 330px; gap:8px; min-height:0;
         position:relative; }      /* ← 查看器的定位参照（它是 .wrap 的孩子，不是 .board 的） */
  /* 左栏：放逐区固定高度，堆叠占剩下的（牌多了自己滚） */
  .leftcol{ display:flex; flex-direction:column; gap:6px; min-height:0; }
  .side{ display:flex; flex-direction:column; gap:6px; min-height:0; }   /* 顶栏右半也在这 */
  .leftcol .sharedbox{ flex:none; flex-direction:column; align-items:flex-start; gap:2px; }
  .leftcol .stackrow{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; margin-bottom:0; }
  .leftcol .stackrow .row{ flex-wrap:wrap; align-content:flex-start; overflow-y:auto; overflow-x:hidden; }
  /* .empty 是给浅色战场写的（深棕色），在深色的堆叠框里看不见 —— 这里单独给一份 */
  .stackrow .empty{ color:#b8a37c; font-size:10.5px; padding:3px 2px; }
  /* 堆叠上的「能力」（114.9，没有牌）：画成一个小小的方块，能点 */
  .cap{ display:block; width:100%; box-sizing:border-box; padding:3px 5px; border:1px solid #7a5a2a;
        border-radius:4px; background:linear-gradient(#4a3418,#33230f); color:#e8d9b4; font-size:10px;
        line-height:1.3; word-break:break-all; }
  .cap.候选{ cursor:pointer; filter:brightness(1.3); border-color:var(--accent); }
  .cap.选好{ outline:2px solid var(--accent); outline-offset:1px; filter:brightness(1.25); }
  .board{ display:flex; flex-direction:column; min-height:0; position:relative; }
  /* 堆叠行：正被打出的牌，可点（无懈可击的目标） */
  .stackrow{ background:linear-gradient(160deg,#3a2a16,#2b1d10); border:2px solid #7a5a2a; border-radius:6px;
             padding:2px 6px 4px; margin-bottom:4px; flex:none; }
  .stackrow .row{ display:flex; gap:6px; align-items:flex-start; min-height:40px; }
  .stackrow .card{ height:var(--卡高-堆叠); }

  /* 半场内部的区块**按比例分满高度**。
     ⚠ 以前是 align-content:start —— 内容排完就停，底下空一截（对面那半场最明显）。 */
  /* ⚠ `flex:1` = `flex:1 1 0` —— 两个半场被**硬切成一模一样高**。
     可我方半场里多了一条操作条，那多出来的一条就只能从我方半场里挤，
     结果是**两边的阵地不一样高**、中线也不在中线上。
     改成 `flex:1 1 auto`：基准 = 各自的内容高，多余的空间再对半分 ——
     于是两边的差别只剩那条操作条，阵地一样高、中线就是中线。 */
  .half{ background:linear-gradient(160deg,var(--mat2),var(--mat)); border:2px solid #3d230e;
         padding:3px 8px; display:grid; gap:3px 8px; min-height:0; flex:1 1 auto;
         align-content:stretch; overflow:hidden; }
  /* ⚠ 不要用 align-self:stretch 把每一行都拉高 ——
     「阵地」那行会被拉高，而格子只有 --卡高-阵地 高，行里就空出一截。
     改成**显式行权重**：余量只给「手牌」那行，其它按内容高。 */
  .half > *{ min-height:0; }
  /* 行权重：**一行不换行的区域按内容高，余量全给「阵地」**。
     手牌 / 领土 / 战场·阵略战器都是 `flex-wrap:nowrap` 横向滚动的一行 ——
     牌再多也只有一行，给它们留高度等于白留，所以高度就是一张卡。
     对手半场：手牌(auto) 牌堆+中场(auto) 阵地(1fr)
     我方半场：阵地(1fr) 中场+牌堆(auto) 操作条(auto) 手牌(auto) */
  .half.opp{ grid-template-rows:auto auto 1fr; }
  .half.me{ grid-template-rows:1fr auto auto auto; }
  .half.me{ grid-template-columns:1fr var(--侧栏宽); border-radius:0 0 8px 8px; border-top:1px dashed rgba(255,255,255,.18); }
  .half.opp{ grid-template-columns:var(--侧栏宽) 1fr; border-radius:8px 8px 0 0; border-bottom:none; }
  /* 谁在行动看操作区那一条就够了（「X 的优先权」），半场不再描边 */
  /* 中场（领土 / 战场·阵略战器）：**吃掉半场的余量** —— 这两块才是牌数会变的地方 */
  .mid2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; min-width:0; align-content:stretch; }
  .mid2 > *{ display:flex; flex-direction:column; }
  .mid2 .zone{ flex:1; }
  .mid2 > *{ min-width:0; }
  .half > *{ min-width:0; }
  .zlabel{ color:#40280f; font-size:10px; letter-spacing:.1em; font-weight:700; }
  /* 区域盒子：**永远占一块地方**（哪怕里面是空的）——
     不然「开局一张手牌都没有」时手牌区整个不存在，看不出那里该放手牌。 */
  /* 区域盒子：**永远占一块地方**（哪怕里面是空的）——
     不然「开局一张手牌都没有」时手牌区整个不存在，看不出那里该放手牌。
     高度按内容（一张卡 + 12px），**不主动吃余量** —— 余量留给所在的行去分。 */
  .zone{ background:rgba(64,40,15,.16); border:1px dashed rgba(64,40,15,.5); border-radius:5px; padding:2px;
         display:flex; flex-direction:column; min-height:calc(var(--卡高-区域) + 12px); }
  .zone .row{ display:flex; gap:12px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
              flex:1; align-items:flex-start; }
  /* 滚动条藏掉：这些区域一行不换行，横向溢出一律用**滚轮**左右移（见下面的 wheel 监听）。
     显式滚轮条会占掉一截高度，而这里最缺的就是高度。 */
  .zone .row{ scrollbar-width:none; }
  .zone .row::-webkit-scrollbar{ display:none; }
  .empty{ color:rgba(64,40,15,.65); font-size:10px; }

  /* 阵地：格子只比卡大一点点（边框 + padding），高度跟着 --卡高-阵地 走 */
  /* 阵地：一行五个，**紧贴中线**（对手那半场排在最底、我方排在最顶，见 半场() 的内容顺序）
     align-content:start —— 格子不能被拉高（高度是 --卡高-阵地） */
  /* ⚠ 阵地那一行会**吃余量**（见上面的行权重）。所以格子必须**跟着那一行长** ——
     否则行变高了、格子还是老高度，多出来的高度就只是空白（「阵地空间没用上」）。
     `grid-auto-rows:1fr` + 格子 height:100%，把这一行的高度分给五个格子。
     min-height 留一个下限：窗口很矮的时候阵地不能塌成一条线。 */
  .slots{ display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(4px, .8vw, 10px);
          grid-auto-rows:1fr; align-content:stretch;
          /* ⚠ **这一条是关键**：`.slots` 自己必须是 100% 高，`grid-auto-rows:1fr` 才有东西可分。
             它是 auto 高的话，1fr 只是「内容高」，格子就永远长不大 —— 上面那些设置全白写。
             外层那个 grid-column:1/-1 的 div 会跟着阵地那一行拉伸，所以 100% 有依据。 */
          height:100%; }
  .slot{ background:rgba(64,40,15,.16); border:1px dashed rgba(64,40,15,.5); border-radius:5px;
         box-sizing:border-box;
         height:100%; min-height:calc(var(--卡高-阵地) + 8px);
         display:flex; align-items:center; justify-content:center; padding:2px; }
  /* 阵地格子：名字（左边路/左侧翼/…）垫在中间，有牌时牌盖在上面 */
  /* ⚠ 这层只是 grid 里的一格；**不要用 display:flex** ——
     那会让里面的 .slot 没有宽度、塌成内容宽，阵地名就被挤成一列竖着的字了。 */
  .slotwrap{ min-width:0; }
  .slotwrap > .slot{ width:100%; }
  .slot .vn{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             color:rgba(64,40,15,.55); font-size:11px; font-weight:700; letter-spacing:.1em;
             pointer-events:none; }
  /* ⚠ 这一层必须 height:100% —— 卡片是 height:100% 跟着它算的；
     容器 auto 高的话，100% 会退回 auto，牌就不跟格子长了（只剩一块空白）。 */
  .slot .slotcard{ position:relative; z-index:1; display:flex; height:100%;
                   align-items:center; justify-content:center; }
  .slot{ position:relative; }
  .slotname{ display:none; }      /* 老的名字行已经不用了 */

  /* 卡：图片区固定高度，关键信息压在图上 */
  /* 卡：卡图盖满整张卡，关键信息压在图上 */
  /* ⚠ flex:0 0 auto 是必须的：不写的话，一行里牌多了会被 flex 横向压扁，
     而高度是写死的 → **卡框比例被破坏**，里面的 background-size:cover 一裁就变形。 */
  .card{ position:relative; overflow:hidden; cursor:pointer;
         height:var(--卡高-区域); width:auto; aspect-ratio:var(--卡比); flex:0 0 auto;
         border:2px solid var(--line); border-radius:5px;
         background:repeating-linear-gradient(45deg,#c9bb9a,#c9bb9a 6px,#d8cdb0 6px,#d8cdb0 12px); }
  .card.p0{ border-color:var(--p0); }
  /* 卡背：隐藏手牌用（401/402） */
  .card.back{ background-image:url('/cards/背面.jpg?v=2'); background-size:cover; background-position:center;
              cursor:default; border-color:#4a3a22; }
  .card.back:hover{ filter:none; }
  .card.p1{ border-color:var(--p1); }
  .card.sel{ outline:2px solid var(--accent); outline-offset:1px; }
  /* 统一选择模型：候选 = 可点，选好 = 已选中。**不加光效**，靠亮度区分 */
  .card.候选{ cursor:pointer; filter:brightness(1.18); }
  /* 选阵地：整块阵地格子可点（点有人的 = 替任它，301.9） */
  /* 阵地：**空位置**没法用「压黑」表达可选 ✗ —— 它必须靠框线：
     可放的虚线框、已选的实线框（卡牌那边才是「不可选的压黑」✓） */
  .slot.候选{ cursor:pointer; outline:2px dashed var(--accent); outline-offset:2px; filter:brightness(1.2); }
  .slot.选好{ outline:3px solid var(--accent); outline-offset:2px; filter:brightness(1.2); }
  /* 已选 = 边框亮（和 173 行 .card.sel 一个表达 ✓）—— 面朝上/暗置的牌**看起来一样** */
  .card.选好{ outline:2px solid var(--accent); outline-offset:-2px; filter:brightness(1.25); }
  /* 有选择任务时，没被选中的牌一律压暗（和「不能用」同一套观感） */
  .board.选择中 .card:not(.候选):not(.选好){ filter:brightness(.5) saturate(.65); }
  /* 「不可点」统一用压黑表达（你定的）：这三条管 阵地 / 牌堆 / 堆叠条目 */
  /* ⚠ 不压黑 .slot —— 单位卡坐在 slot 里，卡自己是候选也被连带压黑了 ✗；
     卡那层的压黑由上面 .card:not(候选) 那条管 ✓ */
  .board.选择中 .pile:not(.候选):not(.选好){ filter:brightness(.5) saturate(.65); }
  .board.选择中 .cap:not(.候选):not(.选好){ opacity:.4; }
  /* 横置：直接把卡转 90 度表现出来（缩小一点免得压到相邻的卡） */
  .card.isTapped{ transform: rotate(90deg) scale(0.82); margin: 0 5px; }
  /* 优先权下：正在行动的那半场里，判断哪些牌能用。
     **不做任何边框光效** —— 只把不能用的压暗，靠对比反衬。
     不放大、不位移（一放大就会超出所在行的高度）。 */
  .half.有可用 .card{ transition: filter .12s; }
  /* ⚠ 要排除「选择任务的候选」：一张地可能既是候选又不是「可用」（比如这回合已经打过地了），
     那样它会被这条压暗 —— 但它是可以点的，看起来就「黑着却能点」。 */
  .half.有可用 .card:not(.可用):not(.候选):not(.选好){ filter: brightness(.5) saturate(.65); }
  /* 查看器（墓地/牌库/放逐区）里的牌不参与这套明暗 */
  .vgrid .card, .vgrid .card:not(.可用){ filter: none; }
  .row .card{ height:var(--卡高-区域); }
  /* 阵地里的卡**跟着格子长**（height:100% + 基类的 aspect-ratio 自动定宽）—— 这样行变高就是牌变大，
   不是多出一块空白。上限由格子的宽度兜着（五个格子分半场宽）。 */
  .slot .card{ height:100%; max-height:100%; }
  /* 卡框比例已经和卡图一致（--卡比），所以 cover 不会裁掉内容 */
  .card .art{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .card .cst, .card .fac, .card .pt, .card .dmg{
    position:absolute; border-radius:3px; padding:0 3px; font-size:9px; font-weight:700;
    background:rgba(0,0,0,.66); color:#ffe9b0; text-shadow:0 1px 2px rgba(0,0,0,.9); }
  /* 205.1 势力印在左上；203 打出费用 / 106.1 势力支持印在右上 */
  .card .fac{ top:1px; left:1px; background:rgba(24,14,6,.8); color:#ffd479; }
  .card .cst{ top:1px; right:1px; }
  /* 数值放在名牌**上方**：名牌是从透明到 86% 黑的渐变，压在最底部会把数值糊掉 */
  .card .pt{ bottom:34px; right:3px; z-index:5; }
  .card .dmg{ bottom:1px; left:1px; color:#ff9d9d; }
  .card .plate{ position:absolute; left:0; right:0; bottom:0; padding:12px 3px 2px;
                background:linear-gradient(transparent, rgba(0,0,0,.55) 30%, rgba(0,0,0,.86)); }
  .card .nm{ font-size:9.5px; font-weight:700; line-height:1.15; color:#fff;
             text-shadow:0 1px 2px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .ty{ font-size:8px; color:#e3d6bb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .tags{ display:flex; gap:2px; flex-wrap:wrap; margin-top:1px; }
  /* 右下角：印在牌上的原始武力/体力 —— 写清楚、加大 */
  .card .pt{ font-size:13px; font-weight:800; color:#fff8e6; background:rgba(18,10,4,.92);
             border:1px solid #c9a05a; border-radius:9px; padding:1px 7px; line-height:18px;
             text-shadow:0 1px 3px #000; box-shadow:0 2px 6px rgba(0,0,0,.8); }
  /* 数值里的增减：+X 绿、-X 红、已受伤（已失去的体力）又是另一种颜色（都跟在印制值后面） */
  .card .pt b{ font-weight:800; }
  .card .pt b.up{ color:#8cf0a8; }
  .card .pt b.dn{ color:#ff9d9d; }
  .card .pt b.hurt{ color:#fff; background:#a3232b; border:1px solid #ff8a8a;
                    border-radius:8px; padding:0 4px; margin-left:3px; font-size:11px; }
  /* 其他标记（灵值、天命…）：左上角一套独立渲染 */
  .card .mk{ position:absolute; top:20px; left:2px; z-index:4; display:flex; flex-direction:column; gap:2px; }
  .card .mk span{ background:#4a2f6b; border:1px solid #c79fe0; color:#f3e8ff; font-weight:800;
                  border-radius:9px; padding:0 5px; font-size:10px; line-height:14px;
                  box-shadow:0 1px 4px rgba(0,0,0,.7); }
  .card .tag{ background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.35); color:#fff;
              border-radius:2px; padding:0 2px; font-size:8px; }
  .card .tag.kw{ background:rgba(140,90,32,.85); border-color:#ffd479; color:#ffe9c0; }
  .zoneboxrow{ display:flex; gap:6px; }
  /* ★ 手牌行：手牌区（左，可伸缩）+ 玩家框（右，固定宽，同高） */
  .handrow{ display:flex; gap:8px; align-items:stretch; }
  .handcol{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .playerbox{ flex:0 0 var(--侧栏宽); display:flex; flex-direction:column; justify-content:center; gap:4px;
              background:rgba(64,40,15,.16); border:1px solid rgba(64,40,15,.5); border-radius:5px; padding:4px 6px; }
  .zonebox.backimg{ background-image:url('/cards/背面.jpg?v=2'); background-size:cover; background-position:center; }
  .zonebox{ position:relative; height:var(--卡高-区域); max-height:none; width:auto; aspect-ratio:484/682; border:2px solid var(--line); border-radius:5px; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
            background:repeating-linear-gradient(45deg,#4a2d14,#4a2d14 5px,#3a2410 5px,#3a2410 10px); }
  .zonebox:hover{ border-color:var(--accent); }
  /* ⚠ 用 background-color 而不是 background 简写：简写会清掉 background-image，把牌库的卡背盖掉 */
  .zonebox.deck{ background-color:#2a3a5a; }
  .zonebox .zb-label{ font-size:10px; color:var(--dim); }
  .zonebox .zb-count{ font-size:18px; font-weight:700; color:#f3ead8; }
  /* 标签/张数要压在牌面上，加一层暗底保证可读 */
  .zonebox .zb-label, .zonebox .zb-count{ position:relative; z-index:2; background:rgba(0,0,0,.55); padding:0 5px; border-radius:3px; }
  .sharedbox{ display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--line);
              border-radius:5px; padding:3px 8px; background:linear-gradient(#3a2410,#2c1a0a); flex:none; }
  .sharedbox:hover{ border-color:var(--accent); }
  .sharedbox b{ color:#f3ead8; }
  /* 查看器：盖住**中间那一列**（战场），左右两栏照旧露着。
     ⚠ 它是 .wrap 的孩子（不是 .board 的）—— 这样开关它只重建自己，
       不会连累两个半场重建（卡图闪、滚动丢）。
       位置就按 .wrap 的三列算：左让开左栏，右让开右栏，各多让一个 gap。 */
  /* 查看器：**别铺满** —— 固定在右侧一个方块里（选择时还要能看见战场与操作条） */
  /* ⚠ **额外区域与主界面「逻辑上平级」** ✓（用户定的）：它不是「谁把谁顶掉」的浮层 ✗，
     而是**同一格里可以同时装好几块**的地方 —— 这一步的选择面板 + 玩家打开的区域视图（可以多个）✓。
     具体摆在哪由屏幕大小决定（现在：右侧一个方块里纵向排，各自滚动 ✓）。 */
  .viewers{ position:absolute; top:6%; right:calc(330px + 8px); width:min(46%, 560px); max-height:84%;

  .viewer{ max-height:70vh; padding:10px 12px; border-radius:8px; border:1px solid #8a6a3a;

  /* 选择时：不符合条件的牌压黑、且点不动（可点只挂在 候选 那层） */
  .viewer .pickable.压黑 .card{ filter: brightness(.42) grayscale(.7); }
  /* 查看器：可选的正常显示，不可选的压黑（见上面 .pickable.压黑）—— 不再描边 ✓ */
  .cardback{ height:var(--卡高-查看); width:auto; aspect-ratio:var(--卡比); border-radius:5px; border:2px solid #1e2a42;

  .pile b{ font-size:11px; color:#f3ead8; }
/* 玩家当目标时，体力牌就是可点的那个（和 .card.候选/.选好 同一套视觉） */

  /* 玩家框里的两行不再各自压黑：可选时整框正常显示，不可选时由下面那条整框压黑 */

  .board.选择中 .playerbox:not(.候选):not(.选好){ filter:brightness(.5) saturate(.65); }
  .pile.选好{ outline:3px solid var(--accent); outline-offset:2px; filter:brightness(1.2); }
  .track{ display:flex; align-items:center; background:linear-gradient(#e6d7b4,#d6c297);
          border:1px solid #4a2c12; border-radius:4px; padding:1px 4px; height:16px; }

  /* 操作条：固定在当前玩家手牌上方 */
  /* 操作条：**自己占一整行**（grid-column:1/-1），内容再多也不许溢出盖到下面的区块上。
     ⚠ 以前写死 height:32px —— 按钮一多就溢出，看着像「盖在非阵地区上」。 */
  .opbar{ grid-column:1/-1; min-height:32px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
          overflow-x:auto; background:linear-gradient(#4a2d14,#331e0c);

  /* 回合归属：优先权可能是别人的，所以单独一块写清楚「这是谁的回合」 */
  .opbar .turninfo{ color:#ffe9b0; font-weight:700; white-space:nowrap;
                    background:rgba(24,14,6,.85); border:1px solid #a8834a; border-radius:9px; padding:0 6px; }
  .opbar .turninfo b{ color:#fff; }
  .opbar .notyours{ color:#ffb0b0; font-weight:400; }

  /* 侧栏：固定比例的卡图 + 固定文字区，内容不推动布局 */
  .side{ display:flex; flex-direction:column; gap:6px; min-height:0; }
  .detail{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px;
           padding:6px 8px; height:64%; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  .detail .dhead{ flex:none; }

  .detail .dbox{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
                 background:#1d1207; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .detail .dbox img{ max-width:100%; max-height:100%; aspect-ratio:484/682; object-fit:contain; }
  .detail .dtext{ flex:none; height:104px; overflow:auto; background:#1d1207; border:1px solid var(--line);
                  border-radius:4px; padding:4px 6px; white-space:pre-wrap; font-size:11px; color:#e8dcc2; }
  .logbox{ flex:1; min-height:70px; overflow:auto; background:#1a0f06; border:1px solid var(--line);
           border-radius:6px; padding:6px 8px; font-size:11px; white-space:pre-wrap; color:#d9c9a8; }
  .sel{ background:#4a2d14; color:#f3ead8; border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }

  .poolcard{ margin:2px; font-size:11px; }
  .deckwrap{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .deckwrap.单列{ grid-template-columns:1fr; }   /* 联机：只看自己那一列 */
  .deckcol{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line);
            border-radius:6px; padding:7px; max-height:56vh; overflow:auto; }
  .deckrow{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  
/* ── 组牌界面（2024 改版）：牌面网格 + 右栏详情 + 筛选 ───────────────── */
.组牌wrap{ grid-template-columns:var(--左栏宽) 1fr 330px; }
/* ⚠ .detail 的 height:64% 是给**游戏界面**定的（那里它下面还有 .logbox 日志框）。
   组牌界面的右栏没有日志框 —— 所以这里把它放开，让它**一路占到底**。 */
.组牌wrap .detail{ height:auto; flex:1; min-height:0; }
/* 卡图框**保持原尺寸**：卡图本来就是被**宽度**限制的（330px 的栏减去内边距），
   所以把框按卡图比例定死，图的大小和以前一模一样；多出来的高度**全给文字区**。 */
.组牌wrap .detail .dbox{ flex:none; aspect-ratio:484/682; }
.组牌wrap .detail .dtext{ flex:1; height:auto; min-height:104px; }
.deckmain{ display:flex; flex-direction:column; gap:6px; min-height:0; }
/* 牌组：缩略图网格，一张牌一格（叠张数） */
.deckwrap{ flex:none; }                       /* 牌组区**固定**，不参与伸缩（不跟着卡池浮动） */
.deckgrid{ display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start; overflow-y:auto;
  flex:none; height:30vh; }                    /* 固定高度、自己滚，不把卡池挤走 */
.thumb{ position:relative; width:62px; aspect-ratio:484/682; border-radius:3px; cursor:pointer;
  background:#1d1207 center/cover; border:1px solid var(--line); flex:none; }
.thumb img{ width:100%; height:100%; object-fit:cover; border-radius:2px; display:block; }
.thumb .n{ position:absolute; right:0; bottom:0; background:rgba(18,10,4,.92); color:#ffe9c0;
  font-size:10px; font-weight:800; padding:0 3px; border-radius:2px 0 0 0; }
.thumb:hover{ border-color:var(--accent); filter:brightness(1.15); }
/* 卡池：牌面网格 */
.poolgrid.图{ display:flex; flex-wrap:wrap; gap:4px; overflow-y:auto; flex:1; min-height:0;
  max-height:none; align-content:flex-start; }   /* 只有卡池伸缩 + 滚动 */
.poolitem{ position:relative; width:74px; aspect-ratio:484/682; border-radius:3px; cursor:pointer;
  background:#1d1207 center/cover; border:1px solid var(--line); flex:none; }
.poolitem img{ width:100%; height:100%; object-fit:cover; border-radius:2px; display:block; }
.poolitem:hover{ border-color:var(--accent); filter:brightness(1.18); }
.poolitem .cnt{ position:absolute; left:0; top:0; background:rgba(18,10,4,.92); color:#8cf0a8;
  font-size:10px; font-weight:800; padding:0 3px; border-radius:0 0 2px 0; }
.poolitem .none{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:9px; text-align:center; padding:2px;
  background:repeating-linear-gradient(45deg,#241708,#241708 6px,#1d1207 6px,#1d1207 12px); }
/* 左栏筛选器 */
.filters{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px;
  padding:6px; display:flex; flex-direction:column; gap:5px; font-size:11px; flex:none; }
.filters label{ color:var(--dim); display:block; margin-bottom:2px; }
.filters select, .filters input{ width:100%; background:#1d1207; color:#f0e2c6;
  border:1px solid var(--line); border-radius:4px; padding:3px 4px; font-size:11px; }
.势力钮{ display:flex; flex-wrap:wrap; gap:3px; }
.势力钮 button{ padding:2px 6px; font-size:11px; }
.势力钮 button.on{ background:linear-gradient(#9a6630,#70461a); border-color:var(--accent); color:#fff; }
.poolgrid{ display:flex; flex-wrap:wrap; gap:4px; max-height:24vh; overflow:auto;
             background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px; padding:6px; }
  #错误{ position:fixed; right:12px; bottom:12px; background:#3a1f1f; border:1px solid var(--bad);
         color:#ffd9d9; padding:8px 12px; border-radius:6px; display:none; max-width:380px; z-index:9; }

  /* ── 联机大厅 ───────────────────────────────────────────── */
  .大厅{ max-width:520px; margin:8vh auto; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:22px 26px; color:var(--ink); }
  .大厅 h1{ margin:0 0 4px; font-size:19px; color:var(--accent); }
  .大厅 p{ margin:6px 0 14px; font-size:13px; line-height:1.7; }
  /* 输入框：深底 + **浅字**（和 .次 同一个毛病：--ink 是给浅色面板的正文用的）*/
  .大厅 input{ background:#1d1710; border:1px solid #6b4d28; color:#f0e4cc;
               border-radius:4px; padding:6px 9px; font-size:13px; margin:0 6px 10px 0; }
  .大厅 input::placeholder{ color:#9c8967; }
  /* 大厅面板是浅底（--panel），它自己的按钮沿用金色 —— 和上面的基础样式是一套观感 */
  .大厅 button{ background:var(--accent); color:#2a1c08; border:0; border-radius:4px;
                padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer; margin-right:8px; }
  /* 次要按钮：深底 + **浅字**。
     ⚠ 以前写的是 color:var(--ink)（#2b1c0e 深棕）—— 那是给**浅色**面板上的正文用的；
       压在 #3a2c1a 的深底上就是深字压深底，看着像「禁用的黑按钮」。 */
  .大厅 .次{ background:#4a3520; color:#f0e4cc; border:1px solid #6b4d28; font-weight:400; }

             border:1px solid var(--line); font-size:13px; }
  .大厅 .座.到{ border-color:var(--accent); color:var(--accent); }

  .房列表{ border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:6px 0 14px; }
  .房行{ display:flex; align-items:center; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .房行:last-child{ border-bottom:0; }
  .房行 b{ color:var(--accent); letter-spacing:1px; min-width:52px; }
  .房行 span{ flex:1; }
  .房行 button{ padding:4px 14px; font-size:12px; margin:0; }

<body>
<div id="转屏提示"><div>请把手机横过来使用<br><span style="font-size:15px;opacity:.75">（这套界面是宽版；横屏后会自动等比缩放，版式和电脑上一样）</span></div></div>
<div id="app">正在载入…</div>
<div id="错误"></div>
<script>

  /**
   * **打出费用 → 显示文字** ✓（界面侧负责解释，发包不迁就界面 ✗）。
   *   现在 费用 是 `费用行为[]`（统一后）：取其中 `支付` 那一条的 `点数` ✓
   *   兼容旧形态：数字 ✓ / 'X' ✓
   */
  function 费用文字(v) {
    if (typeof v === 'number' || typeof v === 'string') return v;      // 数字 / 'X'
    if (Array.isArray(v)) {
      const 支 = v.find((b) => b && b.操作 === '支付');
      if (!支) return '';                                              // 没有数字费用（纯额外费用）
      return 费用文字(支.点数);
    }
    if (v && typeof v === 'object') {
      if ('乘以' in v) return 'X×' + (v.系数 ?? 1);                     // 周瑜 {X}{X}
    if ('加' in v) return 费用文字(v.加) + '+' + v.值;                // {X+2} 显示 X+2
      if ('最小' in v) return v.最小;                                   // 旧区间
    }
    return '';
  }
  /** 打出费用的**数字**（筛选用；'X' 按 0 ✓ 108.3g） */
  function 费用数(v) { const t = 费用文字(v); return typeof t === 'number' ? t : 0; }

window.addEventListener('error', (e) => {
  document.getElementById('app').innerHTML = '<pre style="color:#e07070">脚本错误：' + (e && e.message) + '</pre>';
});
const 符号 = { 蓝:'🔵', 红:'🔴', 绿:'🟢', 黑:'⚫', 紫:'🟣' };
const 顺序 = ['左边路','左侧翼','中路','右侧翼','右边路'];
// ── 令牌：**必须在脚本最顶上** ──────────────────────────────
// ⚠ 这两个原来是 `const`/`let`，写在文件靠后的位置 —— 而 `const` **不提升**，
//   任何在「脚本初始化跑完」之前调用 带令牌() 的路径都会 ReferenceError（TDZ），
//   表现是那个操作**静默失败**（请求根本没发出去，界面卡在「引擎处理中…」）。
//   放最顶上就再也不会有这个坑。
let 令牌 = (() => {
  const u = new URLSearchParams(location.search).get('令牌');
  if (u) { localStorage.setItem('zmdj令牌', u); return u; }
  return localStorage.getItem('zmdj令牌') || '';
})();
const 带令牌 = (体) => 令牌 ? { ...体, 令牌 } : 体;

/** 服务器推来的**最新一份对局状态**（`视图()` 的原样）。整个界面都是它的纯函数渲染 */
let 状态 = null;
/** 详情框里正在看的那张牌。点了卡牌就设它，和「选中（待提交）」是两回事 */
let 选中 = null;
/** 鼠标下的牌（悬停预览用）。⚠ 是**渲染期**的瞬时状态，不要拿它做判断 */
let 悬停 = null;
/** 服务器要玩家做的那个决定（`状态.当前请求`）。没请求时是 null */
let 待选 = null;
/**
 * ── 统一选择模型 ─────────────────────────────────────────────
 * 任何时候**只有一个选择任务**：服务器（或客户端）说「要你选 N 个某种东西」，
 * 客户端把**合法候选**高亮成可点，玩家点它们；操作区只显示进度 + 确认/取消（重来按钮已删 —— 取消就是退出重选）。
 * 这样就不再区分「这里用按钮、那里点卡牌」了。
 *
 * **「选到哪了」只有 `会话` 这一份状态。**
 *
 * ⚠ 以前是**六个变量各管一段、各清各的**：
 *     `已选`（当前任务点到哪）、`已选目标`（宣告的每槽结果）、`已选阵地`（选阵地）、
 *     `宣告模式`（宣告选哪个模式）、`选择`（一次性挑牌）、`待选.已选目标`（施放的目标）。
 *   每个都要自己写「什么时候清」，写漏一个就是「幽灵选中」。出过的事：
 *     · 先手调度的选牌串到后手（高亮显示、还点不掉，因为不在后手手牌里），凑够张数就"确认成功"；

  // ⚠ **对手那一排要左右镜像画**：两个玩家面对面而坐，阵地名是各自「从左至右」起的 ✗ ——
  //   甲·左边路的**相对**阵地是乙·右边路 ✓，屏幕上要让它**正对着**才不误导 ✓
  //   （引擎那边 state.ts 的 相对阵地 也改成了同样的镜像 ✓）
  // ⚠ **参照必须是固定的**（不能按「现在谁在操作」✗ —— 那样每到对方回合整块阵地会翻一次 ✓）。
  //   规则：两个玩家面对面，各自「从左至右」命名 ✓ → **对手那一排**左右反过来画 ✓，
  //   这样我左边路上的单位，屏幕上正对着对手的右边路 ✓（和 相对阵地 的映射一致 ✓）。
  //   热座（单机、我的座位 = null）时以**座位 0（甲）**为参照 ✓ —— 甲的排不镜像、乙的排镜像 ✓，
  //   整局不变 ✓（只有联机、你坐 1 号位时才会以你为参照 ✓）。
  const 我方号 = (s.我的座位 != null) ? s.我的座位 : 0;
  const 这一排顺序 = (i === 我方号) ? 顺序 : [...顺序].reverse();
  for (const 名 of 这一排顺序) {
    const c = pl.阵地[名];
    // 选阵地任务里，合法阵地高亮可点（301.9：点有人的阵地 = 替任它）
    // 只有**该玩家自己的**半场才高亮（对面同名的阵地不该亮）
    // ⚠ 三件事分开 ✓：候选集（画不画框 ✓ 静态）、已选（虚线→实线 ✓）、名额（只决定点击是加还是取消 ✓）。
    //   以前画框用了「还能不能再加」✗ → 选满后框直接消失、也点不动 ✓（2026-02 报的）。
    const 该槽 = 任务 ? 建槽表().find((z) => z.名 === '阵地') : null;
    // ⚠ 两段分工 ✓：**条件**（哪半场）来自任务层（沿用旧字段 任务.阵地玩家 ✓ 不新造 ✗）；
    //   **能不能点/选没选**来自选择系统 ✓（它不认识「阵地」✗）。
    // ⚠ 只问 B ✓（条件在 B 里 ✓ —— 哪半场/名额/已选 都由它一处回答 ✓）
    const 阵地态 = 选态(名, i);   // i = 这一行属于谁 ✓（事实 ✓ 条件在 B 里判 ✓）
    const 阵地候选 = 阵地态 === '可点';
    const 阵地已选 = 阵地态 === '已选';   // 不再依赖 任务.阵地玩家 ✓（条件在 B 里 ✓）（否则取消后/选满时没实线 ✓）
    // 阵地名（左边路/左侧翼/…）**写在格子里面** —— 空阵地时它就是格子里的字，
    //   有牌时牌盖在上面（名字仍在下面垫着，格子是 flex 居中的）。
    h += '<div class="slotwrap"><div class="slot'
      + (阵地候选 ? ' 候选' : '') + (阵地已选 ? ' 选好' : '')
      // ⚠ 选中后也要能点 ✓（点它是取消 ✓）—— 用 可动（可点或已选 ✓），不是「是不是候选」✗
      + ((阵地态 === '可点' || 阵地态 === '已选') ? '" onclick="' + 内联('点阵地', 名) + '"' : '"')
      + '><span class="vn">' + 名 + '</span>'
      // ⚠ 正在选阵地（这一格是候选）时，格子里那张卡**不能挂自己的 onclick** ✗ ——
      //   卡牌() 默认会挂 onclick="选牌(uid)" ✓，点上去就变成「选那张单位」
      //   → 本槽 里是 uid、不是阵地名 → 引擎「选的阵地不合法 / NaN」✓
      //   所以这种时候用**只悬停**渲染（不挂点击 ✓），让点击落到格子的 点阵地(名) 上 ✓
      + (c ? '<span class="slotcard">' + 卡牌(c, true, (阵地态 === '可点' || 阵地态 === '已选')) + '</span>' : '')
      + '</div></div>';
  }
  return h + '</div>';
}

/* ── 操作条：所有选择统一在这里（手牌区上方）──────────────── */

/** 调度弃牌那一步的确认：弃够张数才让提交 */

/**
 * **需求驱动的通用面板** —— 服务端说「这一步要选什么」，这里只把它画出来 + 收确认 ✓。
 * 客户端**不认识任何决定类型** ✗：槽名、要几个、候选叫什么、点完发什么，全部来自 `状态.决定需求` ✓。
 * ⚠ `槽.呈现 === '按钮'` = 这些候选**不在场上**（座位号 / 张数 / 是否发动）→ 画按钮 ✓ ——
 *   由服务端声明，客户端不猜哪个键在屏幕上能点 ✗。
 */
/**
 * **这一步的需求** ✓ —— 面板的**唯一信息来源**：
 *   有任务 → `任务.需求`（动作类：施放/启动/转移/战斗 ✓）；没任务 → `状态.决定需求`（决定类 ✓）。
 */
function 当前需求() { return (任务 && 任务.需求) || (状态 && 状态.决定需求) || null; }

function 需求面板(s) {
  // ⚠ **面板读「需求」，不读 `选择.槽表`** ✗ —— 槽的**呈现方式**（`呈现:'按钮'`）与候选的
  //   **显示名**（`候选.名`）只存在于需求里 ✓；`选择.槽表` 只有「值」（候选键 / 名额 / 已选 / 量）✓。
  //   以前这里读 `选择.槽表` → `z.呈现` 恒为 undefined ✗ → 每个「按钮槽」
  //   （决定先手 / 调度宣告 / 看牌库顶 / 可选触发）都退化成**点不动的进度条** ✗，
  //   整个面板只剩「随机 / 确认」能按 ✓（用户截图那个 ✓）。值仍然只从【选】取 ✓（一处状态 ✓）。
  const 需0 = 当前需求() || {};
  const 槽表 = 需0.槽 || [];
  let x = '<span class="who">' + esc(需0.标题 || (选择 && 选择.名字) || '请选择') + '</span>';
  for (const z of 槽表) {
    const 已选 = (选择 ? (选择.槽已选[z.名] || []) : []);
    const 已量 = 键量和(已选, 槽量表(z));
    const 够 = 已量 >= (z.需?.最小 ?? 0);
    if (z.呈现 === '按钮') {

      }
    } else {
      // ⚠ **候选带 `区` 时，直接在面板里按区域分组画可点的牌子** ✓
      //   为什么要这样：候选可能在**牌库/墓地**这种"棋盘上看不到"的地方 ✗ ——
      //   以前只能靠"自动开一块查看器"✗，而查看器与选择是两回事 ✓（用户定的口径：
      //   查看是随时能开的自由界面 ✓，**要你选的东西一律在这个面板里表达** ✓）。
      //   ⚠ 没有 `名` = 服务端不给牌面 = 你看不到 → 画「背面」✓（客户端不猜牌名 ✗）。
      // ⚠ **面板里不列候选** ✗→✓（用户口径 ✓）：
      //   · 候选在**棋盘 / 查看容器**里点 ✓（那里画着牌 ✓，点中即计入这一槽 ✓）；
      //   · 面板只显示"槽名 + 已选 / 需" ✓；
      //   · 只有服务端标了 `呈现:'按钮'` 的槽（决定先手 / 选项 / 看牌库顶 / 可选触发 ✓）
      //     才在面板里画按钮 ✓ —— 那些候选**不是牌** ✓（棋盘上没有它们 ✓）。
      //   ⚠ 我前几轮在这里列过一串候选（先画牌 ✗、后改成按钮 ✗）—— 都是多余的 ✓，已撤掉 ✓。
      const 需小 = (z.需?.最小 ?? 0), 需大 = (z.需?.最大 ?? 0);
      const 文 = 需小 > 0 ? (已量 + '/' + 需小) : (已量 + (需大 > 0 ? '（最多 ' + 需大 + '）' : ''));
      x += '<span' + (够 ? '' : ' class="notyours"') + '>' + esc(z.名) + ' ' + 文 + '</span>'
    }
  }
  x += '<span class="spacer"></span>';
  // ⚠ **查看入口**：文本统一用「查看」✓（用户口径 ✓）—— 检视/展示不改词 ✓。
  //   计数**直接数当前需求里"带牌面的候选"** ✓（不再读累积的 `可见登记` ✗）：
  //   只在候选来自**棋盘上看不到的区域**（牌库/手牌 ✓）时才给这个入口 ✓
  //   —— 战场/墓地的候选棋盘上本来就看得见 ✓，不必再开一块容器 ✗。
  {
    const 需0 = 当前需求();
    // ⚠ **只认服务端那句话** ✓：`槽.可查看`（"这些候选是可以查看的牌" ✓）。
    //   客户端**不再猜**"有没有牌面 / 是不是隐藏区" ✗ —— 上一版就是猜的，
    //   结果两头出错 ✓：开局"决定先后手"那步冒出「查看」✗、103.6 检视牌库顶那步又没有 ✗。
    // ⚠ 优先用「服务器给的查看内容」✓（规范：查看 = 服务器发的、只读 ✓）；槽.可查看 只是过渡兜底 ✓。
    const 查看数 = ((需0 && 需0.查看) || []).length;
    const 可查看 = [];
    for (const z of (需0 && 需0.槽) || []) {
      if (!z || z.可查看 !== true) continue;
      for (const c of z.候选 || []) if (c) 可查看.push(c);
    }
    if (查看数 || 可查看.length) {
      x += '<button class="act" onclick="' + 内联('开查看', '检视', -1) + '">查看（'
        + (查看数 || 可查看.length) + ' 张）</button>';
    }
  }
  // ⚠ 「不选 / 未搜寻到 / 随机」也是服务端给的**模板 + 文字**（701.17b / 热座随机）✓
  //   —— 客户端不拼 `接受:false`、也不认「随机」这种语义 ✗

  // ⚠ **需要双方确认的步骤**（展示 ✓）：按服务端给的 `双方确认` 画按钮 ✓ ——
  //   · 联机：只画**自己**那个 ✓（别人的按不了 ✓），并标出"谁已确认" ✓；
  //   · 热座：`我的座位 == null` → **两个都画** ✓（各按一次 ✓，顺序无关 ✓）。
  //   这一步**没有别的可选** ✓ → 画完直接 return（不画普通的"提交/放弃" ✓）。
  {
    const 双方 = 状态 && 状态.双方确认;
    if (双方 && Array.isArray(双方.已)) {
      const 需要 = 双方.需要 || [0, 1];
      const 我是 = 状态.我的座位;
      for (const 座 of 需要) {
        const 名 = (状态.players && 状态.players[座] && 状态.players[座].名字) || ('座位 ' + 座);
        if (双方.已.includes(座)) { x += '<span class="dim">' + esc(名) + ' ✓已确认</span>'; continue; }
        if (我是 != null && 座 !== 我是) { x += '<span class="dim">' + esc(名) + ' 待确认…</span>'; continue; }
        x += '<button class="act" onclick="' + 内联('确认展示', 座) + '">' + esc(名) + ' 确认</button>';

    }

  // ★ 取消放**右边**（确认之后）✓ —— 主动作在左、次动作在右 ✓
  if (需0.放弃后发) x += '<button class="act" onclick="放弃选择()">' + esc(需0.放弃名 || '不选') + '</button>';
  return x;
}
/** 放弃分支：照服务端给的模板发 ✓（没有模板就当没有这个按钮 ✓） */
function 放弃选择() {
  const 需0 = 当前需求();
  if (需0 && 需0.放弃后发) 动作(JSON.parse(JSON.stringify(需0.放弃后发)));
}
/**
 * **展示这类"双方确认"步骤**：把"替哪个座位确认"发上去 ✓。
 * ⚠ `确认座位` 只是一个**身份**（不是规则语义 ✓）—— 联机时服务端按令牌核对 ✓，
 *   热座时它是**唯一**能区分"甲按的 / 乙按的"的东西 ✓（一屏两个按钮 ✓）。
 */
function 确认展示(座) {
  const 需0 = 当前需求();
  // ⚠ 走**同一套模板填充** ✓（`填模板` ✓）—— 直接拷 `确认后发` 会把 `'$选'` 这种占位符原样发出去 ✗
  const 包 = (需0 && 填模板(需0, 选择)) || { 种类: '决定', 接受: true };
  /**
   * ⚠ **`选` 一定要带上**（哪怕是空数组 ✓）✗→✓：
   *   展示这类步骤 `需 {0,0}` ✓ → `填模板` 认为"这一步没得选" ✓ → 把 `'$选'` **整个省掉** ✗
   *   → 发出去的决定包**形状不全** ✓（实测：`{"种类":"决定","接受":true,"确认座位":1}` ✓ 没有 `选` ✓）
   *   → 服务端那边这一包就不成立 ✓ = **点了确认却一直停在原地** ✓（2026-10 报的"确认不了" ✓）。

  包.选 = 包.选 ?? [];

/**
 * 操作条 —— **全局唯一的「现在该干什么」出口**。
 *
 * ⚠ 以前开局走一条单独的支路（`if (s.开局.阶段 !== '完成') return 开局操作条(s)`），
 *   那条支路**跳过了下面这个「轮不到自己」的判断** —— 于是联机时两边都画出可点的按钮，
 *   而且每个开局阶段要自己记得判一次「该谁」（漏了三次）。
 *   现在开局和回合都从 `s.当前请求` 来：「谁在动」只有 `请求.玩家` 一处表示。
 */
function 操作条内容(s) {
  if (s.over) return '<span class="who">对局结束</span><span class="dim">'
    + (s.winner === null ? '平手' : esc(s.players[s.winner].名字) + ' 获胜') + '</span>';
  const req = s.当前请求;
  if (!req) return '<span class="dim">引擎处理中…</span>';
  // 联机（非热座）：**只有该动的人才能操作** ✓ —— 这件事现在由**服务端**说 ✓（`可操作` ✓）：
  //   服务端知道"这一步是谁的 ✓ / 展示那种要双方各自确认 ✓"，客户端不再自己推断 ✗
  //   （我原来的推断 + "展示是例外"的补丁 ✓ 已删 ✗ —— 那个例外一放宽就让不该看的人看到内容 ✗）。
  const 能动 = (typeof s.可操作 === 'boolean') ? s.可操作 : 能操作(s, req.玩家);
  // ⚠ **「查看」入口不吃"轮到谁"** ✗→✓（用户铁律：查看是玩家自己的界面状态 ✓，与选择分开 ✓）：
  //   展示那种步骤，**对方也有权看那几张牌** ✓ —— 以前这个按钮长在面板里 ✗，
  //   而面板被 `可操作` 门挡着 ✓ → 不是自己回合的那一方**连看都看不了** ✗
  //   （2026-10 报的"只有自己能看" ✓ / "无法确认" ✓ 都是这条 ✓）。
  const 看 = ((当前需求() || {}).查看 || []);
  const 查看按钮 = 看.length
    ? ' <button class="act" onclick="' + 内联('开查看', '检视', -1) + '">查看（' + 看.length + ' 张）</button>'
    : '';
  if (!能动) {
    // ⚠ **展示这类"要双方确认"的步骤**：等的是**还没确认的那一方** ✓，不是"发起请求的那个人" ✗。
    //   以前照抄 `req.玩家` ✗ → 甲确认后，甲那页还写着"甲 行动中…轮到对方" ✓
    //   → 看起来像卡在自己这儿 ✓（2026-10 报的 ✓）。
    const 双方 = s.双方确认;
    if (双方) {
      const 缺 = (双方.需要 || []).filter((x) => !(双方.已 || []).includes(x));
      return '<span class="who">等待 ' + (缺.map((x) => esc(s.players[x].名字)).join('、') || '对方') + ' 确认</span>'
        + '<span class="dim">（' + esc(req.步骤 || '—') + '）双方都确认后才继续</span>' + 查看按钮;
    }
    return '<span class="who">' + esc(s.players[req.玩家].名字) + ' 行动中…</span>'
      + '<span class="dim">（' + esc(req.步骤 || '—') + '）轮到对方，你暂时没有可做的</span>' + 查看按钮;

  // ── **需求驱动的通用面板** ✓：这一步要选什么，由服务端的需求说 ✓
  //   ⚠ 只在**没有「任务」**时用它 ✓ —— 有任务时走下面那条统一面板（施放/启动那种多槽面板）✓；
  //     两者都是【选】的界面，只是信息来源不同：需求 / 任务 ✓。
  // ⚠ **要双方确认的步骤（展示 ✓）：确认按钮必须画在"面板之外"** ✗→✓
  //   以前那两块按钮长在 `需求面板` 里 ✗ —— 而展示这类步骤在客户端走的是**任务面板** ✓
  //   → 那里没有确认按钮 ✓ → **甲乙谁都没法确认** ✓（2026-10 报的"还是不能确认" ✓ 就是这个 ✓）。
  //   放在这里还有个好处：它是**步骤级**的东西（服务端 `双方确认` 说了算 ✓），
  //   与"这一步要选什么"无关 ✓（展示本身 `需 {0,0}` ✓，没有别的要填 ✓）。
  if (s.双方确认) {
    const 我的座 = s.我的座位;
    const 座s = (s.双方确认.需要 || [])
      .filter((座) => 我的座 === null || 我的座 === -1 || 座 === 我的座);   // 联机只看自己那个 ✓；热座两个都画 ✓
    let y = '<span class="who">' + esc(req.步骤 || '展示') + '</span>';
    for (const 座 of 座s) {
      const 已 = (s.双方确认.已 || []).includes(座);
      y += '<button class="act' + (已 ? ' on' : '') + '"' + (已 ? ' disabled' : '')
        + ' onclick="' + 内联('确认展示', 座) + '">' + esc(s.players[座].名字) + (已 ? ' 已确认' : ' 确认') + '</button>';
    }
    // 联机时把"对方还没确认"也写出来 ✓（不给按钮 ✗，但要看得出在等谁 ✓）
    const 缺 = (s.双方确认.需要 || []).filter((座) => !(s.双方确认.已 || []).includes(座) && !座s.includes(座));
    if (缺.length) y += '<span class="dim">（' + 缺.map((座) => esc(s.players[座].名字)).join('、') + ' 待确认…）</span>';
    return y + 查看按钮;
  }
  if (!任务 && req.决定 && 选择 && 选择.槽表) return 需求面板(s);
  // ── 统一选择任务：操作区只显示进度 + 不选/确认/取消 ──
  if (任务) {
    let x = '';
    // 「宣告」有多个模式时，模式按钮要跟着任务条一起显示（选了模式才知道有哪些目标可点）
    const d0 = req.决定;
    if (d0 && d0.类型 === '宣告' && d0.模式候选) {
      if (会话.模式 === null || !d0.模式候选.some((m) => m.索引 === 会话.模式)) 会话.模式 = d0.模式候选[0].索引;
      x += '<span class="who">' + esc(s.players[req.玩家].名字) + ' 宣告</span>';
      d0.模式候选.forEach((m) => {
        x += '<button class="act' + (会话.模式 === m.索引 ? ' on' : '') + '" onclick="' + 内联('选模式', m.索引) + '">' + esc(m.标签) + '</button>';

      // ⚠ 这里必须留 `x +=` —— X 费牌的 X 不用输入框，但类型和说明这两行还得接上去。
      //   （之前按行删输入框时把 `x +=` 一起删了，剩下以 `+` 开头的三行是**合法语句**：

      /**
       * ⚠ **进度一律从「需求」的槽来** ✓（任务条也要画 ✓）——
       *   以前这里是 `if/else` **语句** + 后面两行以 `+` 开头 ✗ → 那两行变成**一元加** ✗ 直接丢掉 ✓
       *   （就是上面注释 1467-1469 自己写的那个坑 ✓，又被写回来了 ✗）：

       *   现在：需求有槽 → 按槽画 `名 已选/需`（或 `已选（最多 N）`）✓；没有槽才退回任务自带的说明 ✓。
       */
      const 需条 = 任务.需求;
      const 槽们 = (需条 && 需条.槽) || [];
      const 槽文 = (z) => {
        const 已 = (选槽已选(z.名) || []).length;
        const 文 = z.需.最小 > 0 ? (已 + '/' + z.需.最小) : (已 + (z.需.最大 > 0 ? '（最多 ' + z.需.最大 + '）' : ''));
        return esc(z.名) + ' ' + 文;
      };
      const 进度文 = 槽们.length
        ? 槽们.map(槽文).join('　')
        : (任务.是槽表
            ? 建槽表().map((z) => z.名 + ' ' + z.已选.length + '/' + z.需.最小 + (z.已选.length < z.需.最小 ? '（还差）' : '')).join('　')
            : esc(任务.说明 || ''));
      x += '<span class="who">' + esc(任务.类型) + '</span>'
        + '<b>选</b> ' + 进度文
        + '<span class="spacer"></span>';
    // 支付和选择**在同一个面板**：这里把两个进度并排显示，确认要两边都齐。
    //   清空支付不用单独一个按钮 —— 「取消」会清整个会话（支付源也存在 宣告选 里）。
    if (任务.需支付 > 0) {
      // ⚠ **按槽取数** ✓（以前这里是全局已选数 ✗ → 选了阵地+领土会显示「支付 2/1」✗）
  const 付了 = 已付额(选槽已选('支付源'));
      x += '<span' + (付了 >= 任务.需支付 ? '' : ' class="notyours"') + '>支付 ' + 付了 + '/' + 任务.需支付 + '</span>';
    } else if (任务.支付是X) {
      // 108.3a：X 由操控者宣告 —— 在这里**挑几块地就是几**
      const 付了 = 已付额(选槽已选('支付源'));
      x += '<span>X = ' + 付了 + '　挑几块地就是几</span>';
    }
    if (任务.可放弃) x += '<button class="act" onclick="提交(true)">不选</button>';
    // 两个槽各按自己的「量」判（目标按个数，支付按点数）

    // ⚠ 本步挑的东西全在 本槽()（阵地名、目标键…），领土在 支付槽() —— 所以目标量就是本槽的量。
    //   以前用 非支付候选()（= 候选 减去 领土）算，而「阵地」那一步的候选**只有领土**，
    //   于是目标量恒为 0、数量下限 1 永远够不上，确认永远按不动。
    // ⚠ 目标量**不数启动费用**（弃牌/牺牲那些）—— 它们有自己的 费用需 门禁
    // 「目标量」只数**目标**：领土（支付候选）和阵地（候选阵地）也躺在 本槽 里，不能算进来 ——
  //   否则单位施放会因为「已选 1/0」把确认按钮锁死（这就是李典/甄姬按不动确认的原因）。
  // 哪些键**不是目标**：支付（领土）和启动费用（弃牌/牺牲/额外牺牲）永远不算；
  // 阵地要看情况 —— 「转移」那种任务**目标就是阵地本身**（候选池是空的，阵地池才是它），
  // 而「施放」那种多槽任务里，阵地只是并列的一个槽。判据：任务有没有自己的候选池。
  const 阵地算目标 = !(任务.候选 && 任务.候选.size > 0);
  const 是别的槽 = (k) => (任务.候选弃牌 && 任务.候选弃牌.has(k)) || (任务.候选牺牲 && 任务.候选牺牲.has(k))
    || (任务.候选额外 && 任务.候选额外.has(k)) || (任务.候选支付 && 任务.候选支付.has(k))
    || (!阵地算目标 && 任务.候选阵地 && 任务.候选阵地.has(k));
  // ⚠ 「只挑费用」的那几步（额外牺牲 / 费用牺牲）挑中的键属于 候选额外/候选牺牲，
  //   会被 是别的槽 排除掉 → 目标量恒 0。所以这几步直接拿 本槽 的个数当目标量。
  // ⚠ 文字和按钮**必须同一个来源**（槽表）—— 以前文字另算一套（目标量/钱量/费量），
  //   于是可能出现「文字说够了、按钮还是灰」这种自相矛盾，排查时会被它带偏 ✗
  const __槽们 = 建槽表();
  const __槽 = (名) => __槽们.find((z) => z.名 === 名);
  const 目标量 = 任务.只挑费用 ? (__槽('额外牺牲')?.已选.length ?? __槽('费用牺牲')?.已选.length ?? __槽('费用弃牌')?.已选.length ?? 0)
    : __槽们.filter((z) => !['额外牺牲', '费用弃牌', '费用牺牲', '支付源', '阵地'].includes(z.名)).reduce((n, z) => n + z.已选.length, 0);

    const 钱量 = 选择 ? 已选全().filter((k) => 任务.候选支付 && 任务.候选支付.has(k)).length
                     : 计数(选槽已选('支付源'), 任务.候选支付);

    // 启动费用（602.1d）也是数量门禁的一部分：本槽里属于费用候选的那些够不够
    const 费量 = [...已选全()].filter((k) => (任务.候选弃牌 && 任务.候选弃牌.has(k)) || (任务.候选牺牲 && 任务.候选牺牲.has(k)) || (任务.候选额外 && 任务.候选额外.has(k))).length;
  // ⚠ 「确认亮不亮」= **所有槽都够了吗** —— 和 能加 用同一套模型（以前这里把名额又算一遍 ✗，
  //   于是每加一张牌都要在 能加 / 门禁 / 落槽 三处各改一次，漏一处就卡住）。
  const 齐 = 槽都够了吗(建槽表());
    // ⚠ **检视/搜寻面板在场时，这里不再画确认** ✗ —— 那个面板自己带「确认 / 未搜寻到」✓；
  //   两处都画就是**同一个动作两套界面**✗（点了下面那个还会因为参数对不上报
  //   「Uncaught TypeError: 选 is not iterable」✓ —— 2026-02 报的 ✓）。
  // ⚠ 以前这里还要「检视/搜寻面板在场时**不画确认**」✗ —— 现在那条面板已经不存在了 ✓
  //   （检视 = 一块区域视图，确认就画在这里 —— **确认只有一个家** ✓）。
  x += '<button class="act" onclick="提交(false)"' + (齐 ? '' : ' disabled') + '>确认</button>';
    if (任务.可取消) x += '<button class="act" onclick="取消任务()">取消</button>';
    return x;
  }
  const d = req.决定;
  // 宣告任务换人/换模式时要重来（任务条是每次 render 现算的，状态得自己清）
  // ⚠ **弃牌 / 选项 / 可选触发 三个死分支已删** ✗ —— 它们以前在这里自己画按钮并拼字段名
  //   （弃牌:[…] / 选:[…] / 接受:true|false）✓。现在这三类决定都有需求 → 走 需求面板() ✓，
  //   那一段在**本函数开头**就已经 return 了（if (!任务 && req.决定 && 选择 && 选择.槽表)）✓。

  // 普通优先权
  const p = req.玩家;
  const 我位 = s.我的座位 == null ? null : s.我的座位;
  const 是我 = 我位 === null ? null : (p === 我位);
  // 回合归属：优先权可以是别人的（比如甲的回合里乙也有优先权），所以两个都要写
  const 主动名 = esc(s.players[s.active].名字);
  const 是他的回合 = p === s.active;
  let h = '<span class="turninfo"><b>' + 主动名 + '的回合</b>'
    + (是他的回合 ? '' : '<span class="notyours">（现在轮到 ' + esc(s.players[p].名字) + ' 拿优先权）</span>')
    + '</span>'
    + '<span class="who">' + esc(s.players[p].名字) + ' 的优先权</span>'
    + '<span class="dim">' + esc(req.步骤) + (我位 === null ? '（热座：你在替 ' + esc(s.players[p].名字) + ' 操作）'
      : (是我 ? '（你）' : '（对手操作中）')) + '</span>';
  // 联机时对方在动 → 这一条只说「等待」（对方的牌点了也不会动，服务端按座位拒绝）
  if (我位 !== null && !是我) {
    return h + '<span class="dim">等 ' + esc(s.players[p].名字) + ' 操作……</span>';
  }

  if (待选) {
    const a = 待选.动作;
    h += '<span>' + esc(a.标签) + '</span>';
    // ⚠ 攻击对象不在这里列按钮了 —— 它走 当前任务 的【选】（和别的点选同一个模型）。
    // ⚠ **施放不走这里** —— 它由 当前任务 的「统一选择模型」接管（阵地和支付是同一个面板里的两个槽）。
    //   这里以前还留着一个「阵地下拉框 + 确认」的旧兜底，于是当 任务 恰好是 null 时界面会**退化回下拉框**
    //   —— 同一件事的第二条路，已经删掉。打领土也不再需要「选明置/暗置」这一步：
    //   引擎现在把明置和暗置**给成两条并列的动作**（`面` 写在动作里），和「施放」一样一次列完。
    h += '<button onclick="待选=null;render()">取消</button>';
  } else {
    const 能用 = (s.合法动作 || []).filter((a) => a.uid != null);
    if (选中) {
      const 可做 = 能用.filter((a) => a.uid === 选中);
      // ⚠ **不再给「换阵地」开小灶** ✗ —— 702.16 转移 / 116.2c 许可（【急行军】）的**多个目的地**
      //   已经由**服务端**并成一条动作、放进需求的「到」槽 ✓（server.ts 的 合并同族动作 ✓）。
      //   客户端这里只画按钮 ✓ —— 它不再认识任何动作种类 ✓（以前这段按路径去重、只取第一条，
      //   于是「【急行军】只能移到最左边的左边路」✗ —— 2026-02 报的 ✓）。
      可做.forEach((a) => {
        h += '<button class="act" onclick="' + 内联('点动作', s.合法动作.indexOf(a)) + '">' + esc(a.标签) + '</button>';
      });
      if (!可做.length) h += '<span class="dim">这张牌现在不能用</span>';
      h += '<button onclick="选中=null;render()">取消选择</button>';
    }
  }
  if ((s.合法动作 || []).some((a) => a.种类 === '让过')) {
    h += '<button onclick="动作({种类:\'让过\'})">让过</button>';
  }
  return h;
}

/** 渲染一个玩家的半场：阵地五行 + 两侧的牌库/墓地栏。`侧` = '上' | '下'（决定顺序镜像） */
function 半场(s, i, 侧) {
  const pl = s.players[i];
  const 领土 = pl.阵地外.filter((c) => c.类别.includes('领土'));
  const 战场 = pl.阵地外.filter((c) => !c.类别.includes('领土'));
  const 反向 = 侧 === '对手';
  const 手牌数 = pl.隐藏手牌 ? pl.手牌张数 : pl.手牌.length;
  const 手牌内容 = pl.隐藏手牌
    ? (pl.手牌张数 ? Array.from({ length: pl.手牌张数 }, () => '<div class="card back" title="对手手牌：401/402 隐藏区"></div>').join('') : '<span class="empty">（无）</span>')
    : (pl.手牌.length ? pl.手牌.map((c) => 卡牌(c)).join('') : '<span class="empty">（无）</span>');
    // ★ 玩家框（在手牌区右边，同高）：体力（兼「选这个玩家」的点击目标）+ 势力支持
  const 玩家框 = (() => {
    const 玩键 = '玩家' + i;
    const 可 = 选可点(玩键);
    const 选 = 选已中(玩键);
    const 体力块 = '<div class="pile">体力<b>' + pl.体力 + '/' + pl.体力上限 + '</b></div>';
    const 支持块 = '<div class="pile">势力支持<b>' + (Object.entries(pl.支持).map(([k, v]) => 符号[k] + v).join('') || '无') + '</b></div>';
    // 点击区域 = 整个玩家框（不再只点体力条）
    const 可点 = 可 || !!(选择 && 选已中(玩键));
    return '<div class="playerbox' + 框类(玩键, 可) + '"'
      + (可点 ? ' onclick="' + 内联('点选', 玩键) + '" title="选这个玩家为目标"' : '')
      + '><div class="zlabel">' + esc(pl.名字) + '</div>' + 体力块 + 支持块 + '</div>';
  })();
  const 手牌列 = '<div class="handcol"><div class="zlabel">手牌（' + 手牌数 + '）'
    + (pl.隐藏手牌 ? '<span class="dim"> 隐藏</span>' : '') + '</div>'
    + '<div class="zone"><div class="row">' + 手牌内容 + '</div></div></div>';
  // ★ 对手半场**镜像**：玩家框放到左边（左上角）；我方在右边
  const 手牌行 = '<div class="handrow" style="grid-column:1/-1">'
    + (反向 ? 玩家框 + 手牌列 : 手牌列 + 玩家框)
    + '</div>';
  const 领土块 = '<div><div class="zlabel">领土（' + 领土.length + '）</div><div class="zone"><div class="row">'
    + (领土.length ? 领土.map((c) => 卡牌(c)).join('') : '<span class="empty">（无）</span>') + '</div></div></div>';
  // ⚠ 分区名字按**规则书**：403.1「战场分为**阵地**和**阵地以外的战场**……由玩家操控的
  //   非单位实体放在自己面前的战场上」。所以这里不叫「阵略/战器」—— 那只是这个区域里
  //   最常见的两类牌；**没有阵地的单位**（301.8 失去阵地）也放在这里。
  const 战场块 = '<div><div class="zlabel" title="403.1：战场分为阵地和阵地以外的战场。没有阵地的单位也放在这里">阵地以外的战场（' + 战场.length + '）</div><div class="zone"><div class="row">'
    + (战场.length ? 战场.map((c) => 卡牌(c)).join('') : '<span class="empty">（无）</span>') + '</div></div></div>';
  const 牌堆 = '<div><div class="zlabel">牌库 / 墓地</div>'
    + '<div class="zoneboxrow">'
    + '<div class="zonebox deck backimg" onclick="' + 内联('开查看', '牌库', i)
    + '" title="牌库是平级区域：点开能看见张数与背面；被「检视」照到的牌显示正面（401.2/401.3 不能主动查看内容）">'
    + '<span class="zb-label">牌库</span><span class="zb-count">' + pl.牌库张数 + '</span></div>'
    + '<div class="zonebox" onclick="' + 内联('开查看', '墓地', i) + '" title="404.2：墓地是公开区，可以随时检视">'
    + '<span class="zb-label">墓地</span><span class="zb-count">' + pl.墓地对数 + '</span></div>'
    + '</div></div>';
  const 中场 = '<div class="mid2">' + (反向 ? 领土块 + 战场块 : 战场块 + 领土块) + '</div>';
  // 阵地行不再带「我方（甲）的阵地」标题 —— 名字已经写在格子里了。
  const 阵 = '<div style="grid-column:1/-1">' + 阵地行(s, i) + '</div>';
  // 「谁在动」**只有一处**：生成器 yield 出来的请求带的玩家（开局和回合都一样）
  const 行动者 = s.当前请求 ? s.当前请求.玩家 : null;
  const 是当前 = (行动者 === 'both' || 行动者 === i) && !s.over;
    // 全页只有这一条操作区（放在我方半场）。它**永远显示当前该动那一方**的操作：
  // 热座时轮到另一位玩家，操作区就显示他的动作（先在牌面上点他的牌，动作再出现在操作区）；
  // 联机时对方回合，操作条内容会自己退化成「等 XX 操作……」
  const 操作条 = '<div class="opbar">' + 操作条内容(s) + '</div>';;
  const 内容 = 反向
    ? 手牌行 + 牌堆 + 中场 + 阵          // 对手半场：**不放操作条**（操作区只有下面一条）
    : 阵 + 中场 + 牌堆 + 操作条 + 手牌行;
  // 「有可用」加在那个半场，就触发 CSS 那条
  //   .half.有可用 .card:not(.可用):not(.候选):not(.选好){ filter: brightness(.5) saturate(.65) }
  //   → **能用的牌亮，其余全压暗；一张都用不了时所有牌都压暗**。
  //
  // ⚠ 以前写的是「&& 可用牌.size > 0」—— 只在一张都用不了时**反而不压暗**，全亮，容易误以为还能打。
  //
  // 压在哪个半场：
  //   热座（我位 === null）：压在**该他动的那个半场**（热座两边都能操作，看轮到谁）
  //   联机（我位 != null）：**只压我方半场** —— 对方回合我什么都不能做，我的手牌也该是黑的
  //     （对方的半场不压：那不是我能操作的，压了反而像在提示什么）
  //
  // ⚠ 开局流程（决定先手 / 调度宣告 / 调度执行 / 后手看牌库顶）**不压暗** ——
  //   那些阶段手牌是点着选的，而且 可用牌 本来就是空的，压暗会让人以为不能选。
  // 开局做完 = 服务端把 g.开局 置成 null 了 —— 不再有「阶段: 完成」这种状态
  const 对局中 = !s.开局;
  const 热座 = s.我的座位 == null;
  const 该压暗 = 对局中 && (热座 ? 是当前 : i === s.我的座位);
  return '<section data-块="' + (反向 ? '对手半场' : '我方半场') + '" class="half ' + (反向 ? 'opp' : 'me') + (i === s.active ? ' active' : '')
    + (是当前 ? ' acting' : '') + (该压暗 ? ' 有可用' : '') + '">' + 内容 + '</section>';
}

/** uid → 牌面数据。找遍所有区域（含隐藏区），找不到返回 null */
function 找牌(uid) {
  if (uid == null) return null;
  // **当前需求里带牌面的候选**（隐藏区那些 ✓）：服务端只在"这次允许你看"时才带牌面 ✓，
  //   所以「在这里找到」就等于「我看得到」✓ —— 和以前查 `可见登记` 是同一个道理 ✓，
  //   但来源换成**当前这一步**✓ → 不会再出现"容器里画着、详情却查不到"或残留 ✗（用户口径：牌随需求走 ✓）。
  {
    const 需0 = 当前需求();
    for (const z of (需0 && 需0.槽) || []) {
      for (const c of z.候选 || []) if (c && c.卡 && c.卡.uid === uid) return { c: c.卡, 处: '查看（本步能看到的牌）', 我: null };
    }
  }
  for (const pl of 状态.players) {
    for (const c of pl.手牌) if (c.uid === uid) return { c, 处: '手牌', 我: pl.index };
    for (const c of pl.阵地外) if (c.uid === uid) return { c, 处: '战场', 我: pl.index };
    for (const k of 顺序) { const c = pl.阵地[k]; if (c && c.uid === uid) return { c, 处: '阵地 ' + k, 我: pl.index }; }
    // ⚠ 下面这几处以前漏了 —— 结果**查看器里的牌鼠标放上去查不到**（详情一直是空白）。
    //   查看器看的就是墓地和放逐区；堆叠上的牌也要能点、能看。
    for (const c of pl.墓地) if (c.uid === uid) return { c, 处: '墓地', 我: pl.index };
  }
  for (const c of (状态.放逐区 || [])) if (c.uid === uid) return { c, 处: '放逐区', 我: null };
  for (const it of (状态.stack || [])) if (it.卡 && it.卡.uid === uid) return { c: it.卡, 处: '堆叠', 我: it.操控者 };
  return null;
}
/** 这张牌现在能做哪些动作（从 `状态.合法动作` 里筛）。详情框用它列按钮 */
function 该牌动作(uid) { return (状态.合法动作 || []).filter((a) => a.uid === uid); }

/** 详情框现在该显示什么：开局 > 查看器 > 悬停/选中的牌 */
function 详情内容() {
  const o = 状态 && 状态.开局;
  // ⚠ **不再拿「可见登记」的第一张当侧边详情框的默认显示**：检视在新界面里已经统一实现了
  //   —— 效果检视走查看器/检视面板，103.6 开局检视走开局面板，侧边再显示一遍就是同一信息出现两次。
  const uid = 悬停 != null ? 悬停 : 选中;
  const f = 找牌(uid);
  if (!f) return '<div class="dhead"><div class="dname">卡牌信息</div>'
    + '<div class="dmeta">鼠标移到任意牌上看信息；点自己可用的牌，操作会出现在你手牌上方。</div></div>'
    + '<div class="dbox"><span class="dim">（鼠标移到任意牌上）</span></div><div class="dtext">（未选中）</div>';
  const c = f.c;
  return '<div class="dhead"><div class="dname">' + esc(c.名称) + '</div>'
    + '<div class="dmeta">' + esc(类文(c)) + '　' + esc(c.势力 ? c.势力.join('/') : '中立')
    + (c.是单位 ? '　' + c.武力 + '/' + c.体力上限 + (c.已受伤 ? '（受伤 ' + c.已受伤 + '）' : '') : '')
    + '　费用 ' + 费用文字(c.费用) + (需文(c) ? '　需求 ' + 需文(c) : '') + (供文(c) ? '　提供 ' + 供文(c) : '')
    // ⚠ 放逐区是**共享区**（400）—— 找牌() 给它的 我 是 null。
    //   以前这里写的是 players[f.我].名字，鼠标一移到放逐区的牌上就抛
    //   「Cannot read properties of undefined (reading '名字')」。
    + '<br>' + esc(f.处) + '（' + esc(状态.players[f.我]?.名字 ?? '共享区') + '）'
    + (c.横置 ? '　横置' : '') + (c.整备 ? '　整备' : '') + (c.面 === '暗置' ? '　暗置' : '') + '</div></div>'
    // ⚠ 暗置牌：**服务端给图就给** ✓（有权限的人拿到的是真牌面 ✓ —— "暗置牌还是那张牌" ✓）；
    //   服务端没给图（没权限 ✗）才画卡背 ✓。棋盘上仍然按 `面` 画卡背 ✓（这里只影响详情框 ✓）。
    + '<div class="dbox">' + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '">'
        : c.面 === '暗置' ? '<img src="/cards/背面.jpg" alt="暗置">'
        : '<span class="dim">（无卡图）</span>') + '</div>'
    + '<div class="dtext">' + esc(c.文字 || '（无规则文字）') + '</div>';
}
/** 只重画详情框（不重画整个界面）—— 悬停时每次都全画会卡 */
function 刷新详情() {
  const el = document.getElementById('详情');
  if (el) el.innerHTML = 详情内容();
}

/** 卡池里的一张牌（图 + 左上角「当前这一组加了几张」角标） */
function 图块(c, 本组计数) {
  return '<div class="poolitem" title="' + esc(c.名称) + '"'
    + ' onmouseenter="' + 内联('组牌悬停到', c.id) + '" onclick="' + 内联('组牌点选', c.id) + '">'
    + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '" loading="lazy">'
            : '<div class="none">' + esc(c.名称) + '</div>')
    + (本组计数[c.id] ? '<span class="cnt">' + 本组计数[c.id] + '</span>' : '')
    + '</div>';
}

/**
 * **卡池 = 筛选 + 排序**，只有这一份（`组牌面板` 和 `刷新卡池` 都调它，别各写一份）。
 *
 * 排序：**先按所属系列，同系列再按卡牌编号**。
 *   系列用 `localeCompare(…, 'zh')` —— 中文按拼音排（初阵 chū < 怒焰 nù）。
 *   编号用 `numeric: true` —— 这样 '9' 排在 '10' 前面，补零的 '001' 也照样对。
 */
function 过筛排序卡池() {
  const f = 组牌筛选, p = 组牌;
  return p.卡池
    .filter((c) => {
      if (f.词 && (c.名称 + ' ' + (c.副类别 || []).join('') + ' ' + (c.类别 || []).join('')).indexOf(f.词) < 0) return false;
      // 「无势力」= 中立（势力 为 null 或空数组）—— 它和「全部」是两回事，所以用单独的值
      if (f.势力 === '无势力') { if ((c.势力 || []).length) return false; }
      else if (f.势力 && (c.势力 || []).indexOf(f.势力) < 0) return false;
      if (f.类别 && (c.类别 || []).indexOf(f.类别) < 0) return false;
      if (f.费用 !== '' && 费用数(c.费用) !== Number(f.费用)) return false;
      if (f.基本 === '基本' && !c.基本) return false;
      if (f.基本 === '非基本' && c.基本) return false;
      return true;
    })
    .sort((a, b) =>
      String(a.系列).localeCompare(String(b.系列), 'zh')
      || String(a.编号).localeCompare(String(b.编号), 'zh', { numeric: true }));
}
/**
 * **卡池区**（标题行 + 图网格）——单独抽出来是为了「打字时只换这一块」。
 * ⚠ 搜索框在**左栏**，不在这一块里；所以打字时它**根本不会被重建**，光标自然不丢。
 */
function 卡池区(过的, 侧, 可改, 本组计数) {
  return '<div class="zlabel" id="组牌卡池标">卡池——' + (可改 ? '点一下加进「' + 侧 + '」' : '只能看（这是对方那一组）')
    + '（<b id="组牌卡池数">' + 过的.length + '</b> 种）</div>'
    + '<div class="poolgrid 图" id="组牌卡池">'
    + (过的.length ? 过的.map((c) => 图块(c, 本组计数)).join('') : '<span class="dim">（没有符合筛选的牌）</span>')
    + '</div>';
}

/** 组牌面板：左边卡池（带筛选）+ 右边两副牌。整块都在这里渲染 */
function 组牌面板() {
  const p = 组牌;
  const 计数 = (ids) => ids.reduce((m, id) => { m[id] = (m[id] || 0) + 1; return m; }, {});
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;
  /** 现在编辑的这一组能不能动 —— 单机两边都能；联机只能动自己那一组，切过去只能看 */
  const 能改 = (侧) => 我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙');
  const 侧 = p.侧;                       // **当前编辑的那一组**（不是「加给谁」）
  const 可改 = 能改(侧);
  const 找 = (id) => p.卡池.find((x) => x.id === id) || null;

  const f = 组牌筛选;
  const 过的 = 过筛排序卡池();   // 筛选 + 排序都在这一个函数里
  /** **当前编辑这一组**里每张牌有几张（卡池图块左上角的角标）—— 不是双方的合计 */
  const 本组计数 = 计数(p[侧]);
  const 有筛选 = !!(f.词 || f.势力 || f.类别 || f.费用 !== '' || f.基本);

  // ── 当前这一组的牌（缩略图；能改时点一下减一张）──
  const 本组 = () => {
    const m = 计数(p[侧]);
    const ids = Object.keys(m);
    if (!ids.length) return '<div class="deckgrid"><span class="dim">（还没加牌）</span></div>';
    return '<div class="deckgrid">' + ids.map((id) => {
      const c = 找(id) || { id, 名称: id, 图: null };
      return '<div class="thumb" title="' + esc(c.名称) + ' ×' + m[id] + (可改 ? '（点一下减一张）' : '') + '"'
        + ' onmouseenter="' + 内联('组牌悬停到', id) + '"'
        + (可改 ? ' onclick="' + 内联('减牌', 侧, id) + '"' : '') + '>'
        + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '" loading="lazy">'
                : '<div class="none">' + esc(c.名称) + '</div>')
        + '<span class="n">' + m[id] + '</span></div>';
    }).join('') + '</div>';
  };

  const 校 = (t) => !t ? '' : (t.错误 || []).map((e) => '<div style="color:var(--bad)">✗ ' + esc(e) + '</div>').join('')
    + (t.警告 || []).map((e) => '<div class="dim">! ' + esc(e) + '</div>').join('');

  // ── 左栏：标题 + 筛选 ──
  const 势力们 = ['魏', '蜀', '吴', '群', '汉', '无势力'];
  const 类别们 = ['单位', '锦囊', '阵略', '战器', '领土'];
  const 左 = '<div class="leftcol">'
    + '<div class="topbar"><b>组牌</b><span class="dim">' + (我位 === null
        ? '单机：两组都能改'
        : '联机：你只能改 <b style="color:var(--accent)">' + (我位 === 0 ? '甲' : '乙') + '</b>') + '</span></div>'
    + '<div class="filters">'
    + '<div><label>搜索（名称／副类别）</label>'
    + '<input id="组牌搜索" value="' + esc(f.词) + '" placeholder="例如：黄巾、骑、领土" oninput="设筛选(\'词\',this.value)"></div>'
    + '<div><label>势力</label><div class="势力钮">'
    + '<button class="' + (f.势力 === '' ? 'on' : '') + '" onclick="设筛选(\'势力\',\'\')">全部</button>'
    + 势力们.map((x) => '<button class="' + (f.势力 === x ? 'on' : '') + '" onclick="' + 内联('设筛选', '势力', x) + '">' + x + '</button>').join('')
    + '</div></div>'
    + '<div><label>类别</label><div class="势力钮">'
    + '<button class="' + (f.类别 === '' ? 'on' : '') + '" onclick="设筛选(\'类别\',\'\')">全部</button>'
    + 类别们.map((x) => '<button class="' + (f.类别 === x ? 'on' : '') + '" onclick="' + 内联('设筛选', '类别', x) + '">' + x + '</button>').join('')
    + '</div></div>'
    + '<div><label>费用</label><select onchange="设筛选(\'费用\',this.value)">'
    + ['', '0', '1', '2', '3', '4', '5', '6', '7'].map((v) =>
        '<option value="' + v + '"' + (f.费用 === v ? ' selected' : '') + '>' + (v === '' ? '不限' : v + ' 费') + '</option>').join('')
    + '</select></div>'
    + '<div><label>基本／非基本</label><select onchange="设筛选(\'基本\',this.value)">'
    + [['', '不限'], ['基本', '只要基本'], ['非基本', '只要非基本']].map(([v, t]) =>
        '<option value="' + v + '"' + (f.基本 === v ? ' selected' : '') + '>' + t + '</option>').join('')
    + '</select></div>'
    + '<div class="dim">卡池 ' + 过的.length + ' / ' + p.卡池.length + ' 种'
    + (有筛选 ? '　<button class="次" style="padding:2px 6px" onclick="清筛选()">清筛选</button>' : '') + '</div>'
    + '</div></div>';

  // ── 中栏：**只有当前编辑的那一组** + 卡池 ──
  const 中 = '<div class="deckmain">'
    + '<div class="deckwrap 单列"><div class="deckcol">'
    // ⚠ 这里**不写「先手／后手」** —— 先后手是开局按 103.1 决定的（联机随机、
    //   热座可点「甲先手／乙先手／随机」），和座位是甲还是乙没有关系。
    + '<b>' + 侧 + '</b> '
    + '<span class="dim">' + p[侧].length + ' 张' + (可改 ? '' : '　（只能看，不能改）') + '</span> '
    + (可改 ? '<button onclick="' + 内联('清空', 侧) + '">清空</button>'
             : '<span class="dim">（由对方编辑）</span>')
    + 校(p['校验' + 侧]) + 本组() + '</div></div>'
    + 卡池区(过的, 侧, 可改, 本组计数)
    + '</div>';

  // ── 右栏：切换 / 保存 + 详情 ──
  const 右 = '<div class="side">'
    + '<div class="topbar">'
    // **导入 .cod** —— 本地读文件、本地解析成**和手动点选完全一样的卡号数组**，再走「保存牌组」那条路。
    + '<button onclick="document.getElementById(\'导入文件\').click()">导入 .cod</button>'
    + '<input id="导入文件" type="file" accept=".cod,.xml" style="display:none" onchange="导入套牌文件(this)">'
    + '<button onclick="切换组牌侧()">切换到 ' + (侧 === '甲' ? '乙' : '甲') + '</button>'
    // 保存 = 保存**当前编辑的那一组**；不能改这一组时不给保存（联机切到对方就是这种情况）
    + (可改 ? '<button onclick="保存牌组()">保存牌组</button>'
            : '<button disabled title="这一组是对方的，只能看">保存牌组</button>')
    + '<button class="' + (组牌.无限制 ? 'on' : '') + '" onclick="切换无限制()"'
    + ' title="测试用：跳过「同名≤3 张」和「主牌 50 张以上」两条构筑限制">无限制：' + (组牌.无限制 ? '开' : '关') + '</button>'
    + '<button class="次" onclick="组牌=null;render()">取消</button></div>'
    + '<div class="detail" id="组牌详情">' + 组牌详情() + '</div></div>';

  return '<div class="wrap 组牌wrap">' + 左 + 中 + 右 + '</div>';
}

/** 鼠标移到卡池/牌组里的某张牌上 → 右栏显示它 */
function 组牌悬停到(id) { 组牌选 = id; 刷新组牌详情(); }
/** 组牌里点一张卡池的牌 → 右侧显示它的详情 */
function 组牌点选(id) {
  组牌选 = id;
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;
  const 侧 = 组牌.侧;
  // 联机时切到对方那一组 → 只能看，不能加牌
  if (我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙')) 加牌(id);
  else 刷新组牌详情();
}
/**
 * 改一个筛选条件。
 *
 * ⚠ **打字（键 === '词'）时绝对不能整块重画** —— `render()` 会把 `#app` 的 innerHTML
 * 整棵换掉，搜索框变成新节点、焦点丢掉，表现就是「打一个字母光标就跑了」。
 * 所以打字只刷新**卡池那两块**（标题计数 + 图网格），搜索框那个节点从头到尾不被动。
 */
function 设筛选(键, 值) {
  组牌筛选[键] = 值;
  if (键 === '词' && 刷新卡池()) return;
  render();
}
/** 只刷新卡池区；成功返回 true（拿不到节点 = 还没画出来，交给调用方整画） */
function 刷新卡池() {
  const 标 = document.getElementById('组牌卡池标'), 网 = document.getElementById('组牌卡池');
  if (!标 || !网) return false;
  const p = 组牌;
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;
  const 侧 = p.侧;
  const 可改 = 我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙');
  const 过的 = 过筛排序卡池();
  const 本组计数 = p[侧].reduce((m, id) => { m[id] = (m[id] || 0) + 1; return m; }, {});
  标.innerHTML = '卡池——' + (可改 ? '点一下加进「' + 侧 + '」' : '只能看（这是对方那一组）')
    + '（<b id="组牌卡池数">' + 过的.length + '</b> 种）';
  网.innerHTML = 过的.length ? 过的.map((c) => 图块(c, 本组计数)).join('')
                            : '<span class="dim">（没有符合筛选的牌）</span>';
  return true;
}
/** 清空组牌的筛选条件（词/势力/类别/费用/基本 全部归零） */
function 清筛选() { 组牌筛选 = { 词: '', 势力: '', 类别: '', 费用: '', 基本: '' }; render(); }

/** 右栏的详情：和游戏里的 详情内容() 同一套版式（.dhead/.dbox/.dtext） */
function 组牌详情() {
  const c = 组牌 && 组牌选 ? 组牌.卡池.find((x) => x.id === 组牌选) : null;
  if (!c) return '<div class="dhead"><div class="dname">卡牌信息</div>'
    + '<div class="dmeta">鼠标移到卡池或牌组里的牌上看它；点卡池里的牌会加进当前牌组。</div></div>'
    + '<div class="dbox"><span class="dim">（鼠标移到一张牌上）</span></div><div class="dtext">（未选中）</div>';
  const 类 = (c.超类别 || []).concat(c.类别 || [], c.副类别 || []).join('～') || '—';
  const 需 = Object.entries(c.需求 || {}).map(([k, v]) => '{' + k + '}' + v).join('');
  const 供 = Object.entries(c.支持 || {}).map(([k, v]) => '{' + k + '}' + v).join('');
  return '<div class="dhead"><div class="dname">' + esc(c.名称) + '</div>'
    + '<div class="dmeta">' + esc(类) + '　' + esc((c.势力 || []).join('/') || '中立')
    + (c.是单位 && c.武力 != null ? '　' + c.武力 + '/' + c.体力上限 : '')
    + '　费用 ' + 费用文字(c.费用) + (需 ? '　需求 ' + 需 : '') + (供 ? '　提供 ' + 供 : '')
    + '<br>' + esc(c.系列 + ' ' + c.编号) + (c.基本 ? '　【基本】' : '') + '</div></div>'
    + '<div class="dbox">' + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '">' : '<span class="dim">（无卡图）</span>') + '</div>'
    + '<div class="dtext">' + esc(c.文字 || '（无规则文字）') + '</div>';
}
/** 只重画组牌的详情框（不重画整个组牌面板） */
function 刷新组牌详情() {
  const el = document.getElementById('组牌详情');
  if (el) el.innerHTML = 组牌详情();
}

/**
 * **额外区域里同时开着的「区域视图」** ✓ —— 与主界面**逻辑上平级**（用户定的）：
 *   · 可以同时开好几块（【回天术】的候选跨两个墓地 → 两个都得能看见 ✓）
 *   · **谁也不会把谁顶掉** ✗ —— 这一步的【选】面板也在同一格里，两块各自滚动 ✓
 *   · 开 / 关是**纯客户端视图状态** ✓（检视是**许可**、不是动作 → 不占时机、不进堆叠、不记日志 ✓）
 *   · 隐藏区只画服务端给的（`可见登记` / 张数）✓；公开区画服务端发的（`卡()` 已按 `面` 扣掉牌面 ✓）
 */
let 视图 = [];                                   // [{ 区, 玩家 }]
const 视图键 = (v) => v.区 + '|' + v.玩家;
/** 打开一个区域视图（已经开着就不重复开 ✓） */
function 开查看(区, 玩家) {
  const v = { 区, 玩家 };
  if (!视图.some((x) => 视图键(x) === 视图键(v))) 视图.push(v);
  render();

    // ⚠ **候选并集要从「任务的需求」来** ✓ —— 薄任务（施放/启动/转移/战斗）**只带 `需求`** ✗，
    //   没有任何 `候选支付/候选阵地/任务.槽表` 那种老字段 ✓；以前这里先算 `建槽表()` 的并集、
    //   并集空就**不开始选** ✗ → 动作类的【选】根本没建起来 → 目标/阵地/支付源全点不了 ✗
    //   （客户端冒烟抓到的 ✓：施放发出去的包里只剩 uid ✗）。
    const 需0 = 任务.需求;
    // ⚠ 槽表只放**会随玩家操作变的值** ✓ —— 说明性的东西（`呈现` / 候选的显示名 / 点完发什么）
    //   一律留在**需求**里 ✓（面板读需求 ✓）；同一个事实存两份就是补丁山的开头 ✗。
    const 槽表给 = ((需0 && 需0.槽) || []).map((z) => ({
      名: z.名, 需: z.需, 候选: new Set(槽键(z)), 条件: z.条件, 量: 槽量表(z),
    }));
    const 并集 = new Set();
    for (const z of 槽表给) for (const k of z.候选) 并集.add(k);
    const 表 = 建槽表();
    // ⚠ 没有需求的任务（老路）才用客户端自己拼的那份 ✓
    if (!槽表给.length) {
      槽表给.push(...表.map((z) => ({ 名: z.名, 需: z.需, 候选: z.候选 })));
      for (const z of 表) for (const k of z.候选) 并集.add(k);
    }
    const 上限 = 槽表给.reduce((n, z) => n + z.需.最大, 0);
    if (并集.size) 开始选({ 名字: 任务.说明 || '', 源: 选源.战场, 候选: 并集, 槽表: 槽表给,
      数量: { 最小: 0, 最大: 上限 }, 可放弃: false, 已选: [...new Set(表.flatMap((z) => z.已选))],
      // ⚠ **不再有「用途」把 B 抄进 宣告选** ✗ —— C 只在确认时取 B 的结果发 A ✓
      用途: null });
  }


  // ⚠ `搜寻决` 那个变量已删 ✗ —— 它当年给「不许你在检视时打开查看器」那条补丁用 ✓；
  //   现在检视就是一块区域视图、确认只有一个家，没有需要它判的东西了 ✓。
  // 103.4 调度执行：**只有正在调度的那个人**的选牌作数。
  //   ⚠ 这个 Set 以前从不清空 —— 先手选完 3 张轮到后手时，先手的 uid 还留在里面：
  //     后手会看到「已选 3/4」和那 3 张高亮，而且那 3 张不在自己手牌里**点不掉**
  //     （选牌() 只在手牌里才处理）；凑够 N 张就"确认成功"，不报错。
  //   ⚠ 更糟的是 nextUid 每局从 1 重数 —— 新开一局时残留 uid 会**撞上新牌**，
  //     于是「新开一局自动选好了上一局那几张」。
  // ── 顶栏拆成**左右两半**，分别塞进左栏和右栏的顶部 ──
//   这样中间的战场（board）能从**最顶上**开始，多出一整条顶栏的高度。
//   中间不放假内容，只留视觉上的空。
const 顶栏左 = '<div class="topbar"><b>阵面对决</b>'
    + '<span>第 ' + s.turn + ' 回合</span>'
    + (s.开局 && s.turn === 0 ? '<span class="dim">先手：' + esc(s.players[s.先手玩家].名字) + '</span>' : '')
    // 「进行到哪一步」就是 请求.步骤 —— 不再有第二套阶段名
    + '<span>' + (p === null ? (s.开局 && s.当前请求 ? '开局中：' + esc(s.当前请求.步骤) : '—') : '当前：' + esc(s.players[p].名字)) + '</span>'
    + '</div>';
const 顶栏右 = '<div class="topbar">'
    + '<span class="dim">' + esc(s.players[0].名字) + ' ' + s.players[0].体力 + '/' + s.players[0].体力上限 + '　'
    + esc(s.players[1].名字) + ' ' + s.players[1].体力 + '/' + s.players[1].体力上限 + '</span>'
    
      // 按你要求：AI 功能已经删掉 —— 这两个按钮**保留原样**（样式/名字/开关状态都照旧 ✓），
      //   只是**没有 onclick**（按了不做任何事 ✓，不会再开 AI 代理 ✓）。
      + '<button class="' + (s.AI代理 && s.AI代理[0] ? 'on' : '') + '"'
      + ' title="' + esc(s.players[0].名字) + ' AI（AI 功能已移除）">'
      + esc(s.players[0].名字) + ' AI</button>'
      + '<button class="' + (s.AI代理 && s.AI代理[1] ? 'on' : '') + '"'
      + ' title="' + esc(s.players[1].名字) + ' AI（AI 功能已移除）">'
      + esc(s.players[1].名字) + ' AI</button>'
    + (令牌 ? '<button class="次" onclick="离座()" title="离开这个房间；对局中离开会让本局作废">离座</button>' : '')
    + '<button onclick="切布局()">布局</button>'
    + '<button onclick="新局()">新开一局</button><button onclick="打开组牌()">组牌／换牌</button></div>';
let h = '';
  // ── 大区块**分开算**，每块带 data-块 ──
  //   这样 render() 能逐块比对，只替换变了的那些：
  //   没变的节点原地不动 → 卡图不会重新取（不闪）、滚动不动、CSS 过渡不被打断。
  const 左栏html = '<div class="leftcol" data-块="左栏">' + 顶栏左
    + '<div class="sharedbox" onclick="开查看(\'放逐区\',-1)" title="400：放逐区由所有玩家共享；406.3 明置且任何人都能检视">'
    + '<span class="dim">放逐区</span><b>' + s.放逐张数 + '</b></div>'
    + 堆叠行(s)
    + '</div>';
  // 自己的座位永远显示在下面（热座时按座位 0 算）
  const 我的位 = s.我的座位 == null ? 0 : s.我的座位;
  const 对位 = (我的位 + 1) % s.players.length;
  const 对手html = 半场(s, 对位, '对手');
  const 我方html = 半场(s, 我的位, '我方');
  // ⚠ 有【选】在跑 → **只用它的额外面板** ✓（不再另外画一套 ✗）
  // ⚠ **不再二选一** ✗ —— 额外区域与主界面**逻辑上平级**（用户定的）：
  //   这一步的【选】面板（如果有）与玩家打开的区域视图（可以多个）**同时**都在 ✓，
  //   谁也不替换谁 ✓（以前是 `选择 ? 面板 : 查看器` → 选择时墓地打不开 ✗ 2026-02 报的 ✓）。
  //   放哪由屏幕决定：现在都装在同一格里，纵向排、各自滚动 ✓。
  // ⚠ **不做任何自动开 / 自动关** ✗（用户 2026-10 定的 ✓）：
  //   查看容器只有「查看（N 张）」按钮这一个入口 ✓，收起靠容器自己的「关闭」✓ —— 界面不再自作主张 ✓。
  const 视图们 = (视图 || []).map((v) => 区域视图html(s, v)).join('');
  const 查看html = 视图们
    ? '<div class="viewers" data-块="查看器">' + 视图们 + '</div>'
    : '<div data-块="查看器" style="display:none"></div>';
  // ⚠ 战场拆成「板 + 查看器」两块 —— 查看器在对战里开关很频繁，
  //   不拆的话每次开关都会**连累两个半场重建**（卡图闪、滚动丢）。
  const 板html = '<div class="board' + (任务 ? ' 选择中' : '') + '" data-块="战场">' + 对手html + 我方html + '</div>';
  const 查看html块 = 查看html;
  const 右栏html = '<div class="side" data-块="右栏">' + 顶栏右
    + '<div class="detail" id="详情">' + 详情内容() + '</div>'
    // ⚠ 日志框**先画空** —— 内容由 同步日志() 只追加新行（见它的说明）。
    //   写在这里的话，每次渲染都要 join + esc **整条**日志，日志一长就越打越卡。
    + '<div class="logbox" id="日志"></div></div>';
  // ⚠ 半场那两块**没有外层包裹**（它们就是 .board 的直接孩子，grid 靠这个），
  //   所以它们用 outerHTML 逐块替换 —— 见 铺区块()。
  const 块 = [
    { 名: '左栏', html: 左栏html },
    { 名: '战场', html: 板html, 子: [{ 名: '对手半场', html: 对手html }, { 名: '我方半场', html: 我方html }] },
    { 名: '查看器', html: 查看html块 },
    { 名: '右栏', html: 右栏html },
  ];
  // ── 重画等于把 #app 整个换掉，滚动位置/焦点/文本选择都会丢 ──
  //   所以：画之前把各容器的滚动位置记下来，画完原样恢复。
  const 记的滚动 = 记住滚动();
  const 日志原本贴底 = (() => { const x = document.getElementById('日志'); return !x || x.scrollTop + x.clientHeight >= x.scrollHeight - 4; })();
  if (!铺区块(块)) {
    document.getElementById('app').innerHTML = '<div class="wrap">' + 块.map((b) => b.html).join('') + '</div>';
    // 首次整棵重建 —— 把每块的 html 记到节点上，下次才能只替换变了的
    const wrap0 = document.querySelector('#app > .wrap');
    if (wrap0) for (const b of 块) {
      const el = wrap0.querySelector('[data-块="' + b.名 + '"]'); if (el) el.__html = b.html;
      for (const 子 of (b.子 || [])) { const e2 = wrap0.querySelector('[data-块="' + 子.名 + '"]'); if (e2) e2.__html = 子.html; }
    }
  }
  恢复滚动(记的滚动);
  // 日志：只追加新行（**原本就贴着底才跟着滚**，否则你往上翻的时候会被轮询拽回去）
  同步日志(s.log, 日志原本贴底, s.log总数);
  // ⚠ 这里**不再有自动开/关** ✓（已全部删除 ✗）。  上次状态串 = 状态串(s);
  // ⚠ **「按可见登记条数自动弹查看器」那一整套已删** ✗ —— 它当年就是「未知原因的检视界面」的来源 ✓
  //   （`可见登记` 是权限表：只增不减、搜寻一次登记几十张 → 条数 1→42→41→42 跳 → 条数回升就乱弹 ✗）。
  //   检视现在由**当前请求**表达（`决定.类型 === '搜寻'` → 上面那条桥直接**开一块「检视」视图** ✓）：
  //   一张操作一张界面 ✓，不需要任何「猜什么时候该弹」的规则 ✗。
  // ⚠ **删掉「检视不是给我的 → 自动关掉检视那块」** ✗→✓ ——
  //   查看是**玩家自己的**界面状态 ✓：不该被"现在轮到谁"左右 ✓（用户定：查看与选择分开 ✓）。
  //   要关就由玩家自己点关闭 ✓。（当年之所以要自动关，是因为选择**靠**这块容器表达 ✗ —— 那条已经拆了 ✓。）

}

/**
 * **日志只追加**。
 *
 * 每帧都把 `s.log.join('\n')` 整条 esc 一遍再换掉整块 innerHTML，成本是 O(总行数)，
 * 而日志只增不减 —— 越打越卡就是这么来的。这里改成：
 *   · 行数变多 → 只把**新增的那几行** append 进去
 *   · 行数变少（新开一局 / 换房间）→ 整块重建
 *   · 没变 → 什么都不做，只按需贴底
 *
 * ⚠ 「日志框是空的」也要整块重建：右栏那块被替换时（详情变了），日志框会是新的空节点，
 *   这时候如果只 append，前面的历史就丢了。
 */
/**
 * **日志只追加**（按**绝对行号**追加 ✓）。
 *
 * ⚠ 不能拿"这一窗的行数"当进度 ✗ —— 服务端发的是 `log.slice(-100)` ✓，
 *   窗口满了以后长度**恒为 100** ✗ → "有新行"永远判成"没有" ✗
 *   → 表现就是「刚放下的单位没有日志 ✓，等下一次右栏重建才一起冒出来」✓（2026-10 报的 ✓）。
 *   所以服务端另给 `log总数` ✓，这里只比**绝对序号** ✓。
 */
let 上次日志到 = -1;
function 同步日志(行, 原本贴底, 总数) {
  const el = document.getElementById('日志');
  if (!el) { 上次日志到 = -1; return; }
  const 起始 = Math.max(0, (typeof 总数 === 'number' ? 总数 : 行.length) - 行.length);   // 本窗第一行的绝对序号
  const 末尾 = 起始 + 行.length;
  const 空白 = el.innerHTML === '';
  if (空白 || 上次日志到 < 起始 || 上次日志到 > 末尾) {
    // 节点被换掉了（空白 ✓）、或者服务端从头来过 / 窗口滑动得我们接不上 ✗ → 整块重建
    el.innerHTML = esc(行.join('\n'));
    上次日志到 = 末尾;
    if (原本贴底 || 空白) el.scrollTop = el.scrollHeight;
    return;
  }
  if (末尾 > 上次日志到) {
    el.insertAdjacentHTML('beforeend', (上次日志到 > 起始 ? '\n' : '') + esc(行.slice(上次日志到 - 起始).join('\n')));
    上次日志到 = 末尾;
  }
  if (原本贴底) el.scrollTop = el.scrollHeight;
}

/* ── 重画时的滚动/焦点保护 ────────────────────────────────────
   轮询每 1.2 秒会重画一次；不保护的话，滚动条、输入焦点、文本选择全会被重置。 */
const 可滚动选择器 = ['.logbox', '.zone .row', '.leftcol .stackrow .row', '.vgrid', '.opbar', '.deckcol', '.deckgrid', '.poolgrid', '.prewrap'];
/* ── 滚轮 = 横向滚动 ──────────────────────────────────────────
   「一行不换行」的区域（手牌 / 领土 / 战场·阵略战器）只在横向溢出，所以滚轮直接左右移。
   ⚠ `passive:false` 不能省：不写的话 preventDefault 无效，滚轮会把整个页面也跟着滚。
   ⚠ 只在**真的溢出**时才拦 —— 没溢出还拦着，页面就滚不动了。 */
document.addEventListener('wheel', (e) => {
  const el = e.target && e.target.closest && e.target.closest('.zone .row');
  if (!el || el.scrollWidth <= el.clientWidth) return;
  e.preventDefault();
  el.scrollLeft += (e.deltaY || e.deltaX);
}, { passive: false });

/* ── 手机适配：**原样横屏**（只等比缩小，不重排）──────────────────────
   设计宽度 1280 ✓；窗口更窄就整体 `zoom` 缩放（桌面上 = 1 ✓ 完全不变 ✓）。
   竖屏时给一块提示让玩家转屏 ✓（这块布局是宽版 ✓，竖屏缩下去没法看 ✗）。 */
const 设计宽 = 1280;
function 适配屏幕() {
  // ⚠ 防御：测试桩/残缺环境里没有 window.innerWidth 或 body.classList ✗ →
  //   适配是**锦上添花** ✓，绝不能因此让整个脚本挂掉 ✗（客户端 harness 就在这种环境里跑 ✓）。
  if (!document.body || !document.body.classList || !document.body.style ||
      typeof window.innerWidth !== 'number' || typeof window.innerHeight !== 'number') return;
  const 横 = window.innerWidth > window.innerHeight;
  /**
   * ⚠ **只在横屏缩放** ✗→✓ —— 用户实测：竖屏时 `390/1280 ≈ 0.3` ✓，
   *   所有按钮被缩到 **10px 上下** → "**好像没法点击**" ✗（不是坏了，是点不中 ✓）。
   * 所以：**竖屏 = 不缩**（正常大小、能点 ✓）+ 铺一层"请横屏"提示 ✓；
   *        **横屏 = 等比缩到刚好放下** ✓（844/1280 ≈ 0.66 ✓，按钮 ≈ 26px ✓ 手点得动 ✓）。
   */
  const 缩 = 横 ? Math.min(1, Math.max(320, window.innerWidth) / 设计宽) : 1;
  /**
   * ⚠ `zoom` 会把**高度也一起缩** ✗ —— 而 `#app` 写的是 `100vh` ✓ →
   *   缩 0.66 之后布局只占屏幕 **66% 高** ✗（下面一大片空 ✓），
   *   而版式本来就是按"满屏高"排的 ✓ → 内容挤在一起、还会重叠 ✗（用户截的就是这样 ✓）。
   * 所以要把高度**按同样倍数撑回去** ✓：`#app` 用 `calc(100vh / var(--缩放))` ✓。
   */
  document.documentElement.style.setProperty('--缩放', String(缩));
  document.body.style.zoom = 缩 === 1 ? '' : String(缩);
  document.body.classList.toggle('竖屏', !横);
}
window.addEventListener('resize', 适配屏幕);
window.addEventListener('orientationchange', () => setTimeout(适配屏幕, 120));
适配屏幕();

/**
 * **局部更新**：逐块比对，只替换变了的那块。
 *
 * 以前是 `#app.innerHTML = h` —— **整棵重建**，代价：
 *   卡图重新取（闪）、滚动归零、输入焦点丢、CSS 过渡被打断、hover 丢、整树重排。
 * 现在没变的节点**原地不动**，那些问题自然都没了。
 *
 * 返回 false = 结构对不上（首次渲染 / 从大厅切进来 / 块数变了）→ 调用方整棵重建。
 */
function 铺区块(块) {
  const app = document.getElementById('app');
  const wrap = app && app.firstElementChild;
  if (!wrap || !wrap.classList.contains('wrap')) return false;
  // 大区块：按 data-块 找，替换 outerHTML
  for (const b of 块) {
    const el = wrap.querySelector(':scope > [data-块="' + b.名 + '"]');
    if (!el) return false;                       // 结构变了 → 让调用方重建
    if (el.__html !== b.html) {
      el.outerHTML = b.html;
      // ⚠ outerHTML 替换后拿到的是新节点，缓存标记要重新挂
      const 新 = wrap.querySelector(':scope > [data-块="' + b.名 + '"]');
      if (新) 新.__html = b.html;
    }
    // 子块（半场）：它们在 .board 里，没有自己的外层包裹 → 也用 data-块 找
    for (const 子 of (b.子 || [])) {
      const 子el = wrap.querySelector('[data-块="' + 子.名 + '"]');
      if (!子el) return false;
      if (子el.__html !== 子.html) {
        子el.outerHTML = 子.html;
        const 新子 = wrap.querySelector('[data-块="' + 子.名 + '"]');
        if (新子) 新子.__html = 子.html;
      }
    }
  }
  return true;
}

/** 重画前记下各个滚动容器的位置 —— 不记的话每 8 秒轮询会把滚动条拽回顶部 */
function 记住滚动() {
  const 记的 = [];
  for (const sel of 可滚动选择器) {
    document.querySelectorAll(sel).forEach((el, i) => 记的.push([sel, i, el.scrollLeft, el.scrollTop]));
  }
  const ae = document.activeElement;
  return { 滚动: 记的, 焦点: ae && ae.id ? ae.id : null,
           选择: (ae && ae.selectionStart != null) ? [ae.selectionStart, ae.selectionEnd] : null };
}
/** 重画后把滚动位置放回去（配对 记住滚动） */
function 恢复滚动(记的) {
  if (!记的) return;
  for (const [sel, i, sl, st] of 记的.滚动) {
    const el = document.querySelectorAll(sel)[i];
    if (el) { el.scrollLeft = sl; el.scrollTop = st; }
  }
  if (记的.焦点) {
    const el = document.getElementById(记的.焦点);
    if (el && el.focus) { el.focus(); if (记的选择 && el.setSelectionRange) { try { el.setSelectionRange(记的选择[0], 记的选择[1]); } catch {} } }
  }
}

/** 服务端状态的指纹 —— 没变就不用重画（重画会丢滚动位置和焦点）*/
let 上次状态串 = null;
/** 状态指纹：字段没变就不重画。⚠ 用的字段名必须和 server.ts 发的完全一致，写错就是 undefined */
function 状态串(s) {
  // ⚠ 字段名必须和 server.ts 发的**完全一致** —— 写错的话这里是 undefined，
  //   比较会永远「没变」→ 画面再也不刷新。改服务端字段时这里要跟着改。
  return JSON.stringify([
    s.turn, s.over, s.winner, s.开局, s.当前请求, s.合法动作, s.可见登记, s.AI代理, s.可支付来源,
    // ⚠ 准备相关的字段也要算进指纹 —— 不然「乙点了准备」不会触发重画，

    s.准备, s.都准备, s.等准备, s.人齐, s.已开始,
    s.放逐区, s.放逐张数, s.stack,
    // 日志只比长度：比内容便宜，而新增日志一定会改变长度
    (s.log || []).length,
    s.players.map((p) => [
      p.体力, p.体力上限, p.支持, p.本回合已打领土,
      p.手牌, p.手牌张数, p.隐藏手牌, p.阵地, p.阵地外, p.墓地, p.墓地对数, p.牌库张数,
    ]),
  ]);
}

/** 把 已选目标 组装成 宣告 动作。⚠ 字段是 目标名 —— 引擎要的就是它（以前这里发 slot，发错了）*/
function 组装宣告(d, 规格) {
  const 目标 = [];
  for (const sp of 规格 || []) {
    // ⚠ **两处都要读** ✗ —— 同一个「已选」在这里有两种落点：
    //   · 施放那条路（槽表）直接写 `宣告选[目标名]` ✓
    //   · **结算时选目标**（触发式能力的待定目标 ✓）走 点选 → 写的是 `本槽()` = 宣告选[任务.步] ✗
    //   只读前者的话，后者永远组装出空目标 ✓ → 引擎「移动：找不到目标」✗（009 后备虎骑 那次 ✓）。
    //   多余的键由下面的 `sp.候选.find` 过滤掉 ✓，所以合并是安全的 ✓。
    for (const uid of [...new Set([...(宣告选[sp.目标名] || [] || []), ...(选择 ? 已选全() : [])])]) {
      // ⚠ 键可能是玩家（'玩家N'）—— 玩家没有 uid
      if (typeof uid === 'string' && uid.startsWith('玩家')) {
        目标.push({ 目标名: sp.目标名, 类型: '玩家', 玩家: Number(uid.slice(2)) }); continue;
      }
      const c = sp.候选.find((x) => x.uid === uid);
      if (c) 目标.push({ 目标名: sp.目标名, 类型: c.类型, uid: c.uid, 玩家: c.玩家 });

  return { 种类: '宣告', 模式: d.模式候选 ? 会话.模式 : undefined, 目标 };

/** 发一个动作给服务器，拿回新状态并重画。**所有玩家操作的唯一出口**（别处直接 fetch 会漏掉错误提示） */
async function 动作(体) {
  const r = await (await fetch('/api/action', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(带令牌(体)),
  })).json();
  if (r.状态) 状态 = r.状态;
  待选 = null; 会话.模式 = null;
  // ⚠ **动作做完就把「点选」清掉** —— 这是所有动作的共同出口（让过 / 施放 / 转移 / 启动能力 / 发起战斗）。
  //   不清的话，点了「让过」之后棋盘上那张牌还亮着、详情框还停在它上面 ——
  //   看起来像「还选着它」，但优先权已经交出去了。
  //   注意：这里**不动 `会话`** —— 多步的施放向导要在这一步之后继续读 宣告选。
  选中 = null; 悬停 = null;   // 只清「点选」—— 会话留给多步施放向导
  // ⚠ **动作成功 = 这一次选择结束了** ✓ → 清掉【选】✓
  //   不清的话：施放/决定成功后，阵地/领土的**实线框与已选**会留在界面上 ✗
  //   （施放完成后**请求键没变** ✓ → `对齐选择状态()` 不会清它 ✗ → 看着像「还选着」✓ 2026-02 报的 ✓）
  //   失败时**保留** ✓ —— 玩家通常只需改一个选择再确认 ✓。
  if (r.ok) 选择 = null;
  if (!r.ok) 提示(r.错误 || '这个动作不合法');
  render();
}

/** 点合法动作列表里的第 idx 项。按动作种类分派：能直接做完的就发请求，要选目标的先建任务 */
function 点动作(idx) {
  const a = 状态.合法动作[idx];
  if (!a) return;
  // ⚠ **开始一个新动作 = 会话重来**。
  //   不清的话，上一张牌挑的**阵地**和**支付源**还留在 宣告选 里，于是下一张牌：
  //     · `当前任务` 的阵地那支看到「槽里已经有阵地了」→ 跳过；
  //     · 支付那支看到「已经够付了」→ 也跳过；
  //   → 一个任务都算不出来，界面就退化成旧兜底（下拉框）。
  //   表现就是**第一张正常、后面都不正常**。
  //   这里只可能在没有任务时才被点到（有任务时渲染的是任务面板，不是这张按钮表），所以清得安全。
  清掉选择();
  // ⚠ **零选择的动作**（让过 / 打领土…）不走面板 —— 直接照**服务端的模板**发 ✓
  //   （客户端不再拼 `种类` / `uid` / `面` 这些字段名 ✗：模板里 `种类` 是字面量、`uid`/`面` 是 `@字段` ✓）
  if (!(a.需求 && (a.需求.槽 || []).length)) {
    const 发 = 填模板(a.需求, a);
    if (发) return 动作(发);
  }
  // ⚠ 转移 / 启动能力 / 施放 都是同一件事：**把这条动作挂起来，界面由它的需求画** ✓
  //   （阵地高亮/点选、目标、支付源、启动费用，全在 `待选.动作.需求` 的槽里 ✓）
  if (a.种类 === '转移' || a.种类 === '启动能力' || a.种类 === '发起战斗' || a.种类 === '施放') {
    待选 = { 动作: a };
    选中 = null;
    return render();
  }
}

/**
 * **导入 .cod**（Cockatrice 牌组）：本地读、本地解析 —— 解析出来的就是**卡号数组**，
 *   和玩家在卡池里一张张点出来的**完全同一种东西**，所以后面直接复用「保存牌组」。
 *
 * 卡号 = 「系列-编号」，而 .cod 里写的是 `[初阵·031]无懈可击` —— 把 `·` 换成 `-` 就对上了，
 *   不必查名字（名字只用来在认不出时报给人看）。
 *
 * ⚠ **备牌（side）直接忽略**：现在只玩主牌，备牌留到有换备规则时再说（认不出的牌会列出来，不静默丢）。
 */
async function 导入套牌文件(inp) {
  const f = inp.files && inp.files[0];
  inp.value = '';                       // 同一个文件能再导一次
  if (!f || !组牌) return;
  let 文本 = '';
  try { 文本 = await f.text(); } catch (err) { 提示('读文件失败：' + err.message); return; }
  // 只认 <zone name="main"> 那一段（备牌不要）
  const 主区 = (文本.match(/<zone name="main">([\s\S]*?)<\/zone>/) || [])[1] ?? 文本;
  const 有 = new Set(组牌.卡池.map((c) => c.id));
  const ids = []; const 缺 = [];
  for (const m of 主区.matchAll(/<card number="(\d+)" name="([^"]+)"/g)) {
    const 数量 = Number(m[1]);
    const 原名 = m[2];
    const k = 原名.match(/^\[([^·]+)·([^\]]+)\](.*)$/);
    const id = k ? k[1] + '-' + k[2] : '';
    if (!id || !有.has(id)) { 缺.push(原名); continue; }
    for (let i = 0; i < 数量; i++) ids.push(id);
  }
  if (!ids.length) { 提示('这个文件里没有能认出来的主牌' + (缺.length ? '（' + 缺.slice(0, 5).join('、') + '…）' : '')); return; }
  组牌[组牌.侧] = ids;
  render();
  提示('已导入 ' + f.name + '：' + ids.length + ' 张' + (缺.length ? '，' + 缺.length + ' 种没认出来（' + 缺.slice(0, 3).join('、') + '…）' : '')
    + '　—— 正在保存到本房间');
  await 保存牌组();
}

/** SSE 连接：连上后服务端每次「推进」停下都会推一份状态过来 */

    事件源.onopen = () => { 推送状态 = '已连'; render(); };
    事件源.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        // 大厅订阅的推送：只有房间列表，没有对局状态
        推送收到++;

        状态 = d;
        我 = 状态.我的座位;
        if (!待选 && !会话.模式) render();
      } catch { /* 忽略坏消息 */ }
    };
    // 断了 EventSource 自己会重连（浏览器自带），这里不用管
    事件源.onerror = () => { 推送状态 = '断开'; 上次状态串 = null; render(); };   // 重连后强制对齐一次
  } catch { 事件源 = null; }
}

/**
 * **从服务器拉一次状态**。SSE 推送是主通道，这个是**兜底**（8 秒一次，外加回到前台时补一次）。
 * ⚠ 后台标签页里浏览器会节流定时器，所以「在不在线」不能只看这个请求的间隔 —— 见 server.ts 的 在线()。
 */
async function 刷新() {
  try {
    状态 = await (await fetch(带令('/api/state'))).json();
    我 = 状态.我的座位;
    if (!令牌 || !状态.人齐) await 载入房间列表();
    // 正在选目标 / 宣告模式时不要打断
    // 状态没变就**不重画** —— 重画会把滚动条和输入焦点重置掉。
    //   （如果这期间客户端自己改过东西，那些操作都直接调过 render()，所以跳过后画面仍是最新的）
    const 变了 = 状态串(状态) !== 上次状态串;
    if (变了 && !待选 && !会话.模式) render();
  } catch {}
}

(async () => {
  try {
    状态 = await (await fetch(带令('/api/state'))).json();
    我 = 状态.我的座位;
    await 载入房间列表();
    render();
    if (decodeURIComponent(location.search).indexOf('组牌') >= 0) await 打开组牌();
    // ?查看=放逐区 / ?查看=墓地:0 / ?查看=牌库:1 —— 直接打开区域视图（便于深链和自动化）
    const 查 = new URLSearchParams(location.search).get('查看');
    if (查) { const [区, 位] = 查.split(':'); 开查看(区, 位 == null ? -1 : Number(位)); }
    // **SSE：服务端主动推** —— 端1 动作后，服务端直接把新状态推给端2，不用等轮询。
    //   轮询留着当**兜底**（推送断了照样能跑），但间隔放宽到 8 秒。
    开推送();
    setInterval(刷新, 8000);
// 后台标签页里浏览器会节流定时器（轮询最慢约 60 秒一次）。回到前台立刻补一次，
//   不用干等下一个周期 —— 顺便让「掉线」标记及时消掉。
document.addEventListener('visibilitychange', () => { if (!document.hidden) 刷新(); });
  } catch (e) {
    document.getElementById('app').innerHTML = '<pre style="color:#e07070">载入失败：' + e
      + '\n\n如果你是用 file:// 直接打开的，请改用 http://127.0.0.1:8787</pre>';
  }
})();
</script>
