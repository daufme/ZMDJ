<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阵面对决 · 测试台</title>
<style>
  :root{
    --mat:#7a4f26; --mat2:#93602f; --line:#5b3c1c;
    --ink:#2b1c0e; --cream:#f7f1e2; --cream2:#eee4cf;
    --p0:#2f7d4f; --p1:#a83232; --accent:#ffd479; --dim:#d8c39a; --bad:#e07070;

    --卡比: 484 / 682;
    --卡高-阵地: clamp(76px, 8.6vh, 116px);
    --卡高-区域: clamp(84px, 10.2vh, 138px);
    --卡高-堆叠: clamp(48px, 6.2vh, 84px);
    --卡高-查看: clamp(104px, 14vh, 176px);

    --侧栏宽: clamp(92px, 8.6vw, 132px);

    --左栏宽: clamp(126px, 11vw, 196px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{ margin:0; color:#f3ead8; font:12px/1.4 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
        background:radial-gradient(circle at 30% -10%, #57351a, #241407 65%) #241407; }

  #app{ height:calc(100vh / var(--缩放, 1)); display:flex; flex-direction:column; padding:6px 8px; gap:6px; }

#转屏提示{ display:none; position:fixed; inset:0; z-index:99; background:var(--panel);
  color:var(--ink); align-items:center; justify-content:center; text-align:center; font-size:20px; line-height:1.8; }
body.竖屏 #转屏提示{ display:flex; }

@media (max-width:820px){
  .viewer{ padding:6px !important; }
  .opbar{ padding:4px 6px !important; gap:4px !important; }
  .act{ padding:3px 6px !important; font-size:12px !important; }
}

  button{ background:linear-gradient(#8a5a28,#633d16); color:#fff3dd; border:1px solid #a8834a;
          border-radius:5px; padding:3px 8px; cursor:pointer; font:inherit;
          box-shadow:0 1px 2px rgba(0,0,0,.35); }
  button:hover{ border-color:var(--accent); color:#fff; background:linear-gradient(#9a6630,#70461a); }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button.on{ border-color:#ffe9a8; color:#2b1c0e; background:linear-gradient(#ffd479,#e8b455); font-weight:700; }
  .dim{ color:var(--dim); }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  .topbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:28px; flex:none;
           background:linear-gradient(#4a2d14,#331e0c); border:1px solid var(--line);
           border-radius:6px; padding:3px 8px; font-size:11px; }
  .topbar b{ color:var(--accent); font-size:12px; }
  .topbar .spacer{ flex:1; }
  header{ display:flex; gap:10px; align-items:center; height:30px; flex:none;
          background:linear-gradient(#4a2d14,#331e0c); border:1px solid var(--line);
          border-radius:6px; padding:0 10px; }
  header b{ color:var(--accent); font-size:13px; }
  header .spacer{ flex:1; }

  .wrap{ flex:1; display:grid; grid-template-columns:var(--左栏宽) 1fr 330px; gap:8px; min-height:0;
         position:relative; }

  .leftcol{ display:flex; flex-direction:column; gap:6px; min-height:0; }
  .side{ display:flex; flex-direction:column; gap:6px; min-height:0; }
  .leftcol .sharedbox{ flex:none; flex-direction:column; align-items:flex-start; gap:2px; }
  .leftcol .stackrow{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; margin-bottom:0; }
  .leftcol .stackrow .row{ flex-wrap:wrap; align-content:flex-start; overflow-y:auto; overflow-x:hidden; }

  .stackrow .empty{ color:#b8a37c; font-size:10.5px; padding:3px 2px; }

  .cap{ display:block; width:100%; box-sizing:border-box; padding:3px 5px; border:1px solid #7a5a2a;
        border-radius:4px; background:linear-gradient(#4a3418,#33230f); color:#e8d9b4; font-size:10px;
        line-height:1.3; word-break:break-all; }
  .cap.候选{ cursor:pointer; filter:brightness(1.3); border-color:var(--accent); }
  .cap.选好{ outline:2px solid var(--accent); outline-offset:1px; filter:brightness(1.25); }
  .board{ display:flex; flex-direction:column; min-height:0; position:relative; }

  .stackrow{ background:linear-gradient(160deg,#3a2a16,#2b1d10); border:2px solid #7a5a2a; border-radius:6px;
             padding:2px 6px 4px; margin-bottom:4px; flex:none; }
  .stackrow .row{ display:flex; gap:6px; align-items:flex-start; min-height:40px; }
  .stackrow .card{ height:var(--卡高-堆叠); }

  .half{ background:linear-gradient(160deg,var(--mat2),var(--mat)); border:2px solid #3d230e;
         padding:3px 8px; display:grid; gap:3px 8px; min-height:0; flex:1 1 auto;
         align-content:stretch; overflow:hidden; }

  .half > *{ min-height:0; }

  .half.opp{ grid-template-rows:auto auto 1fr; }
  .half.me{ grid-template-rows:1fr auto auto auto; }
  .half.me{ grid-template-columns:1fr var(--侧栏宽); border-radius:0 0 8px 8px; border-top:1px dashed rgba(255,255,255,.18); }
  .half.opp{ grid-template-columns:var(--侧栏宽) 1fr; border-radius:8px 8px 0 0; border-bottom:none; }

  .mid2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; min-width:0; align-content:stretch; }
  .mid2 > *{ display:flex; flex-direction:column; }
  .mid2 .zone{ flex:1; }
  .mid2 > *{ min-width:0; }
  .half > *{ min-width:0; }
  .zlabel{ color:#40280f; font-size:10px; letter-spacing:.1em; font-weight:700; }

  .zone{ background:rgba(64,40,15,.16); border:1px dashed rgba(64,40,15,.5); border-radius:5px; padding:2px;
         display:flex; flex-direction:column; min-height:calc(var(--卡高-区域) + 12px); }
  .zone .row{ display:flex; gap:12px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
              flex:1; align-items:flex-start; }

  .zone .row{ scrollbar-width:none; }
  .zone .row::-webkit-scrollbar{ display:none; }
  .empty{ color:rgba(64,40,15,.65); font-size:10px; }

  .slots{ display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(4px, .8vw, 10px);
          grid-auto-rows:1fr; align-content:stretch;

          height:100%; }
  .slot{ background:rgba(64,40,15,.16); border:1px dashed rgba(64,40,15,.5); border-radius:5px;
         box-sizing:border-box;
         height:100%; min-height:calc(var(--卡高-阵地) + 8px);
         display:flex; align-items:center; justify-content:center; padding:2px; }

  .slotwrap{ min-width:0; }
  .slotwrap > .slot{ width:100%; }
  .slot .vn{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             color:rgba(64,40,15,.55); font-size:11px; font-weight:700; letter-spacing:.1em;
             pointer-events:none; }

  .slot .slotcard{ position:relative; z-index:1; display:flex; height:100%;
                   align-items:center; justify-content:center; }
  .slot{ position:relative; }
  .slotname{ display:none; }

  .card{ position:relative; overflow:hidden; cursor:pointer;
         height:var(--卡高-区域); width:auto; aspect-ratio:var(--卡比); flex:0 0 auto;
         border:2px solid var(--line); border-radius:5px;
         background:repeating-linear-gradient(45deg,#c9bb9a,#c9bb9a 6px,#d8cdb0 6px,#d8cdb0 12px); }
  .card.p0{ border-color:var(--p0); }

  .card.back{ background-image:url('/cards/背面.jpg?v=2'); background-size:cover; background-position:center;
              cursor:default; border-color:#4a3a22; }
  .card.back:hover{ filter:none; }
  .card.p1{ border-color:var(--p1); }
  .card.sel{ outline:2px solid var(--accent); outline-offset:1px; }

  .card.候选{ cursor:pointer; filter:brightness(1.18); }

  .slot.候选{ cursor:pointer; outline:2px dashed var(--accent); outline-offset:2px; filter:brightness(1.2); }
  .slot.选好{ outline:3px solid var(--accent); outline-offset:2px; filter:brightness(1.2); }

  .card.选好{ outline:2px solid var(--accent); outline-offset:-2px; filter:brightness(1.25); }

  .board.选择中 .card:not(.候选):not(.选好){ filter:brightness(.5) saturate(.65); }

  .board.选择中 .pile:not(.候选):not(.选好){ filter:brightness(.5) saturate(.65); }
  .board.选择中 .cap:not(.候选):not(.选好){ opacity:.4; }

  .card.isTapped{ transform: rotate(90deg) scale(0.82); margin: 0 5px; }

  .half.有可用 .card{ transition: filter .12s; }

  .half.有可用 .card:not(.可用):not(.候选):not(.选好){ filter: brightness(.5) saturate(.65); }

  .vgrid .card, .vgrid .card:not(.可用){ filter: none; }
  .row .card{ height:var(--卡高-区域); }

  .slot .card{ height:100%; max-height:100%; }

  .card .art{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .card .cst, .card .fac, .card .pt, .card .dmg{
    position:absolute; border-radius:3px; padding:0 3px; font-size:9px; font-weight:700;
    background:rgba(0,0,0,.66); color:#ffe9b0; text-shadow:0 1px 2px rgba(0,0,0,.9); }

  .card .fac{ top:1px; left:1px; background:rgba(24,14,6,.8); color:#ffd479; }
  .card .cst{ top:1px; right:1px; }

  .card .pt{ bottom:34px; right:3px; z-index:5; }
  .card .dmg{ bottom:1px; left:1px; color:#ff9d9d; }
  .card .plate{ position:absolute; left:0; right:0; bottom:0; padding:12px 3px 2px;
                background:linear-gradient(transparent, rgba(0,0,0,.55) 30%, rgba(0,0,0,.86)); }
  .card .nm{ font-size:9.5px; font-weight:700; line-height:1.15; color:#fff;
             text-shadow:0 1px 2px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .ty{ font-size:8px; color:#e3d6bb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .tags{ display:flex; gap:2px; flex-wrap:wrap; margin-top:1px; }

  .card .pt{ font-size:13px; font-weight:800; color:#fff8e6; background:rgba(18,10,4,.92);
             border:1px solid #c9a05a; border-radius:9px; padding:1px 7px; line-height:18px;
             text-shadow:0 1px 3px #000; box-shadow:0 2px 6px rgba(0,0,0,.8); }

  .card .pt b{ font-weight:800; }
  .card .pt b.up{ color:#8cf0a8; }
  .card .pt b.dn{ color:#ff9d9d; }
  .card .pt b.hurt{ color:#fff; background:#a3232b; border:1px solid #ff8a8a;
                    border-radius:8px; padding:0 4px; margin-left:3px; font-size:11px; }

  .card .mk{ position:absolute; top:20px; left:2px; z-index:4; display:flex; flex-direction:column; gap:2px; }
  .card .mk span{ background:#4a2f6b; border:1px solid #c79fe0; color:#f3e8ff; font-weight:800;
                  border-radius:9px; padding:0 5px; font-size:10px; line-height:14px;
                  box-shadow:0 1px 4px rgba(0,0,0,.7); }
  .card .tag{ background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.35); color:#fff;
              border-radius:2px; padding:0 2px; font-size:8px; }
  .card .tag.kw{ background:rgba(140,90,32,.85); border-color:#ffd479; color:#ffe9c0; }
  .zoneboxrow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .zonebox.backimg{ background-image:url('/cards/背面.jpg?v=2'); background-size:cover; background-position:center; }
  .zonebox{ position:relative; height:100%; max-height:62px; width:auto; aspect-ratio:484/682; border:2px solid var(--line); border-radius:5px; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
            background:repeating-linear-gradient(45deg,#4a2d14,#4a2d14 5px,#3a2410 5px,#3a2410 10px); }
  .zonebox:hover{ border-color:var(--accent); }
  .zonebox.deck{ background:repeating-linear-gradient(135deg,#2a3a5a,#2a3a5a 5px,#1e2a42 5px,#1e2a42 10px); }
  .zonebox .zb-label{ font-size:9px; color:var(--dim); }
  .zonebox .zb-count{ font-size:14px; font-weight:700; color:#f3ead8; }
  .sharedbox{ display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--line);
              border-radius:5px; padding:3px 8px; background:linear-gradient(#3a2410,#2c1a0a); flex:none; }
  .sharedbox:hover{ border-color:var(--accent); }
  .sharedbox b{ color:#f3ead8; }

  .viewers{ position:absolute; top:6%; right:calc(330px + 8px); width:min(46%, 560px); max-height:84%;
            z-index:20; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .viewer{ max-height:70vh; padding:10px 12px; border-radius:8px; border:1px solid #8a6a3a;
           background:rgba(12,6,2,.94);
           display:flex; flex-direction:column; gap:8px; }
  .viewer .vhead{ display:flex; gap:10px; align-items:center; flex:none; }
  .viewer .vgrid{ flex:1; overflow:auto; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; }
  .viewer .card{ height:var(--卡高-查看); }
  .viewer .pickable{ display:inline-block; }

  .viewer .pickable.压黑 .card{ filter: brightness(.42) grayscale(.7); }

  .cardback{ height:var(--卡高-查看); width:auto; aspect-ratio:var(--卡比); border-radius:5px; border:2px solid #1e2a42;
             background:repeating-linear-gradient(135deg,#2a3a5a,#2a3a5a 6px,#1e2a42 6px,#1e2a42 12px); }
  .prewrap{ flex:1; overflow:auto; }
  .prebox{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px;
           padding:10px 12px; margin-bottom:8px; }
  .pile{ display:flex; justify-content:space-between; align-items:baseline; border-radius:3px;
         padding:0 5px; margin-bottom:1px; background:linear-gradient(#3a2410,#2a190a);
         border:1px solid var(--line); color:var(--dim); font-size:10px; line-height:1.25; }
  .pile b{ font-size:11px; color:#f3ead8; }

  .pile.候选{ cursor:pointer; outline:2px dashed var(--accent); outline-offset:2px; filter:brightness(1.2); }
  .pile.选好{ outline:3px solid var(--accent); outline-offset:2px; filter:brightness(1.2); }
  .track{ display:flex; align-items:center; background:linear-gradient(#e6d7b4,#d6c297);
          border:1px solid #4a2c12; border-radius:4px; padding:1px 4px; height:16px; }
  .track .tlabel{ color:#40280f; font-size:9px; font-weight:700; padding:0 5px; white-space:nowrap; }
  .track .cell{ flex:1; position:relative; text-align:center; border-left:1px solid rgba(64,40,15,.25); min-width:0; }
  .track .cell b{ color:#5a4020; font-size:8px; font-weight:400; }
  .track .cell i{ display:block; height:5px; margin:0 1px; border-radius:1px; opacity:.1; }
  .track .cell i.p0{ background:var(--p0); }
  .track .cell i.p1{ background:var(--p1); }

  .opbar{ grid-column:1/-1; min-height:32px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
          overflow-x:auto; background:linear-gradient(#4a2d14,#331e0c);
          border:1px solid var(--accent); border-radius:6px; padding:3px 8px; }
  .opbar.off{ border-color:var(--line); background:transparent; }
  .opbar::-webkit-scrollbar{ height:5px; }
  .opbar::-webkit-scrollbar-thumb{ background:#5b3c1c; border-radius:3px; }
  .opbar .who{ color:var(--accent); font-weight:700; white-space:nowrap; }

  .opbar .turninfo{ color:#ffe9b0; font-weight:700; white-space:nowrap;
                    background:rgba(24,14,6,.85); border:1px solid #a8834a; border-radius:9px; padding:0 6px; }
  .opbar .turninfo b{ color:#fff; }
  .opbar .notyours{ color:#ffb0b0; font-weight:400; }

  .side{ display:flex; flex-direction:column; gap:6px; min-height:0; }
  .detail{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px;
           padding:6px 8px; height:64%; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  .detail .dhead{ flex:none; }
  .detail .dname{ font-size:13px; font-weight:700; color:var(--accent); }
  .detail .dmeta{ color:var(--dim); font-size:10.5px; }
  .detail .dbox{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
                 background:#1d1207; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .detail .dbox img{ max-width:100%; max-height:100%; aspect-ratio:484/682; object-fit:contain; }
  .detail .dtext{ flex:none; height:104px; overflow:auto; background:#1d1207; border:1px solid var(--line);
                  border-radius:4px; padding:4px 6px; white-space:pre-wrap; font-size:11px; color:#e8dcc2; }
  .logbox{ flex:1; min-height:70px; overflow:auto; background:#1a0f06; border:1px solid var(--line);
           border-radius:6px; padding:6px 8px; font-size:11px; white-space:pre-wrap; color:#d9c9a8; }
  .sel{ background:#4a2d14; color:#f3ead8; border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }

  .poolcard{ margin:2px; font-size:11px; }
  .deckwrap{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .deckwrap.单列{ grid-template-columns:1fr; }
  .deckcol{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line);
            border-radius:6px; padding:7px; max-height:56vh; overflow:auto; }
  .deckrow{ display:flex; justify-content:space-between; align-items:center; gap:6px; }

.组牌wrap{ grid-template-columns:var(--左栏宽) 1fr 330px; }

.组牌wrap .detail{ height:auto; flex:1; min-height:0; }

.组牌wrap .detail .dbox{ flex:none; aspect-ratio:484/682; }
.组牌wrap .detail .dtext{ flex:1; height:auto; min-height:104px; }
.deckmain{ display:flex; flex-direction:column; gap:6px; min-height:0; }

.deckwrap{ flex:none; }
.deckgrid{ display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start; overflow-y:auto;
  flex:none; height:30vh; }
.thumb{ position:relative; width:62px; aspect-ratio:484/682; border-radius:3px; cursor:pointer;
  background:#1d1207 center/cover; border:1px solid var(--line); flex:none; }
.thumb img{ width:100%; height:100%; object-fit:cover; border-radius:2px; display:block; }
.thumb .n{ position:absolute; right:0; bottom:0; background:rgba(18,10,4,.92); color:#ffe9c0;
  font-size:10px; font-weight:800; padding:0 3px; border-radius:2px 0 0 0; }
.thumb:hover{ border-color:var(--accent); filter:brightness(1.15); }

.poolgrid.图{ display:flex; flex-wrap:wrap; gap:4px; overflow-y:auto; flex:1; min-height:0;
  max-height:none; align-content:flex-start; }
.poolitem{ position:relative; width:74px; aspect-ratio:484/682; border-radius:3px; cursor:pointer;
  background:#1d1207 center/cover; border:1px solid var(--line); flex:none; }
.poolitem img{ width:100%; height:100%; object-fit:cover; border-radius:2px; display:block; }
.poolitem:hover{ border-color:var(--accent); filter:brightness(1.18); }
.poolitem .cnt{ position:absolute; left:0; top:0; background:rgba(18,10,4,.92); color:#8cf0a8;
  font-size:10px; font-weight:800; padding:0 3px; border-radius:0 0 2px 0; }
.poolitem .none{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:9px; text-align:center; padding:2px;
  background:repeating-linear-gradient(45deg,#241708,#241708 6px,#1d1207 6px,#1d1207 12px); }

.filters{ background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px;
  padding:6px; display:flex; flex-direction:column; gap:5px; font-size:11px; flex:none; }
.filters label{ color:var(--dim); display:block; margin-bottom:2px; }
.filters select, .filters input{ width:100%; background:#1d1207; color:#f0e2c6;
  border:1px solid var(--line); border-radius:4px; padding:3px 4px; font-size:11px; }
.势力钮{ display:flex; flex-wrap:wrap; gap:3px; }
.势力钮 button{ padding:2px 6px; font-size:11px; }
.势力钮 button.on{ background:linear-gradient(#9a6630,#70461a); border-color:var(--accent); color:#fff; }
.poolgrid{ display:flex; flex-wrap:wrap; gap:4px; max-height:24vh; overflow:auto;
             background:linear-gradient(#3a2410,#2c1a0a); border:1px solid var(--line); border-radius:6px; padding:6px; }
  #错误{ position:fixed; right:12px; bottom:12px; background:#3a1f1f; border:1px solid var(--bad);
         color:#ffd9d9; padding:8px 12px; border-radius:6px; display:none; max-width:380px; z-index:9; }

  .大厅{ max-width:520px; margin:8vh auto; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:22px 26px; color:var(--ink); }
  .大厅 h1{ margin:0 0 4px; font-size:19px; color:var(--accent); }
  .大厅 p{ margin:6px 0 14px; font-size:13px; line-height:1.7; }

  .大厅 input{ background:#1d1710; border:1px solid #6b4d28; color:#f0e4cc;
               border-radius:4px; padding:6px 9px; font-size:13px; margin:0 6px 10px 0; }
  .大厅 input::placeholder{ color:#9c8967; }

  .大厅 button{ background:var(--accent); color:#2a1c08; border:0; border-radius:4px;
                padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer; margin-right:8px; }

  .大厅 .次{ background:#4a3520; color:#f0e4cc; border:1px solid #6b4d28; font-weight:400; }
  .大厅 .座{ display:inline-block; padding:4px 12px; border-radius:4px; margin-right:8px;
             border:1px solid var(--line); font-size:13px; }

  return '<section data-块="' + (反向 ? '对手半场' : '我方半场') + '" class="half ' + (反向 ? 'opp' : 'me') + (i === s.active ? ' active' : '')
    + (是当前 ? ' acting' : '') + (该压暗 ? ' 有可用' : '') + '">' + 内容 + '</section>';
}

function 找牌(uid) {
  if (uid == null) return null;

  {
    const 需0 = 当前需求();
    for (const z of (需0 && 需0.槽) || []) {
      for (const c of z.候选 || []) if (c && c.卡 && c.卡.uid === uid) return { c: c.卡, 处: '查看（本步能看到的牌）', 我: null };
    }
  }
  for (const pl of 状态.players) {
    for (const c of pl.手牌) if (c.uid === uid) return { c, 处: '手牌', 我: pl.index };
    for (const c of pl.阵地外) if (c.uid === uid) return { c, 处: '战场', 我: pl.index };
    for (const k of 顺序) { const c = pl.阵地[k]; if (c && c.uid === uid) return { c, 处: '阵地 ' + k, 我: pl.index }; }

    for (const c of pl.墓地) if (c.uid === uid) return { c, 处: '墓地', 我: pl.index };
  }
  for (const c of (状态.放逐区 || [])) if (c.uid === uid) return { c, 处: '放逐区', 我: null };
  for (const it of (状态.stack || [])) if (it.卡 && it.卡.uid === uid) return { c: it.卡, 处: '堆叠', 我: it.操控者 };
  return null;
}

function 该牌动作(uid) { return (状态.合法动作 || []).filter((a) => a.uid === uid); }

function 详情内容() {
  const o = 状态 && 状态.开局;

  const uid = 悬停 != null ? 悬停 : 选中;
  const f = 找牌(uid);
  if (!f) return '<div class="dhead"><div class="dname">卡牌信息</div>'
    + '<div class="dmeta">鼠标移到任意牌上看信息；点自己可用的牌，操作会出现在你手牌上方。</div></div>'
    + '<div class="dbox"><span class="dim">（鼠标移到任意牌上）</span></div><div class="dtext">（未选中）</div>';
  const c = f.c;
  return '<div class="dhead"><div class="dname">' + esc(c.名称) + '</div>'
    + '<div class="dmeta">' + esc(类文(c)) + '　' + esc(c.势力 ? c.势力.join('/') : '中立')
    + (c.是单位 ? '　' + c.武力 + '/' + c.体力上限 + (c.已受伤 ? '（受伤 ' + c.已受伤 + '）' : '') : '')
    + '　费用 ' + c.费用 + (需文(c) ? '　需求 ' + 需文(c) : '') + (供文(c) ? '　提供 ' + 供文(c) : '')

    + '<br>' + esc(f.处) + '（' + esc(状态.players[f.我]?.名字 ?? '共享区') + '）'
    + (c.横置 ? '　横置' : '') + (c.整备 ? '　整备' : '') + (c.面 === '暗置' ? '　暗置' : '') + '</div></div>'

    + '<div class="dbox">' + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '">'
        : c.面 === '暗置' ? '<img src="/cards/背面.jpg" alt="暗置">'
        : '<span class="dim">（无卡图）</span>') + '</div>'
    + '<div class="dtext">' + esc(c.文字 || '（无规则文字）') + '</div>';
}

function 刷新详情() {
  const el = document.getElementById('详情');
  if (el) el.innerHTML = 详情内容();
}

function 图块(c, 本组计数) {
  return '<div class="poolitem" title="' + esc(c.名称) + '"'
    + ' onmouseenter="' + 内联('组牌悬停到', c.id) + '" onclick="' + 内联('组牌点选', c.id) + '">'
    + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '" loading="lazy">'
            : '<div class="none">' + esc(c.名称) + '</div>')
    + (本组计数[c.id] ? '<span class="cnt">' + 本组计数[c.id] + '</span>' : '')
    + '</div>';
}

function 过筛排序卡池() {
  const f = 组牌筛选, p = 组牌;
  return p.卡池
    .filter((c) => {
      if (f.词 && (c.名称 + ' ' + (c.副类别 || []).join('') + ' ' + (c.类别 || []).join('')).indexOf(f.词) < 0) return false;

      if (f.势力 === '无势力') { if ((c.势力 || []).length) return false; }
      else if (f.势力 && (c.势力 || []).indexOf(f.势力) < 0) return false;
      if (f.类别 && (c.类别 || []).indexOf(f.类别) < 0) return false;
      if (f.费用 !== '' && c.费用 !== Number(f.费用)) return false;
      if (f.基本 === '基本' && !c.基本) return false;
      if (f.基本 === '非基本' && c.基本) return false;
      return true;
    })
    .sort((a, b) =>
      String(a.系列).localeCompare(String(b.系列), 'zh')
      || String(a.编号).localeCompare(String(b.编号), 'zh', { numeric: true }));
}

function 卡池区(过的, 侧, 可改, 本组计数) {
  return '<div class="zlabel" id="组牌卡池标">卡池——' + (可改 ? '点一下加进「' + 侧 + '」' : '只能看（这是对方那一组）')
    + '（<b id="组牌卡池数">' + 过的.length + '</b> 种）</div>'
    + '<div class="poolgrid 图" id="组牌卡池">'
    + (过的.length ? 过的.map((c) => 图块(c, 本组计数)).join('') : '<span class="dim">（没有符合筛选的牌）</span>')
    + '</div>';
}

function 组牌面板() {
  const p = 组牌;
  const 计数 = (ids) => ids.reduce((m, id) => { m[id] = (m[id] || 0) + 1; return m; }, {});
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;

  const 能改 = (侧) => 我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙');
  const 侧 = p.侧;

  const 找 = (id) => p.卡池.find((x) => x.id === id) || null;

  const f = 组牌筛选;
  const 过的 = 过筛排序卡池();

  const 本组计数 = 计数(p[侧]);
  const 有筛选 = !!(f.词 || f.势力 || f.类别 || f.费用 !== '' || f.基本);

  const 本组 = () => {
    const m = 计数(p[侧]);
    const ids = Object.keys(m);
    if (!ids.length) return '<div class="deckgrid"><span class="dim">（还没加牌）</span></div>';
    return '<div class="deckgrid">' + ids.map((id) => {
      const c = 找(id) || { id, 名称: id, 图: null };

        + ' onmouseenter="' + 内联('组牌悬停到', id) + '"'
        + (可改 ? ' onclick="' + 内联('减牌', 侧, id) + '"' : '') + '>'
        + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '" loading="lazy">'
                : '<div class="none">' + esc(c.名称) + '</div>')
        + '<span class="n">' + m[id] + '</span></div>';
    }).join('') + '</div>';
  };

  const 校 = (t) => !t ? '' : (t.错误 || []).map((e) => '<div style="color:var(--bad)">✗ ' + esc(e) + '</div>').join('')
    + (t.警告 || []).map((e) => '<div class="dim">! ' + esc(e) + '</div>').join('');

  const 势力们 = ['魏', '蜀', '吴', '群', '汉', '无势力'];
  const 类别们 = ['单位', '锦囊', '阵略', '战器', '领土'];
  const 左 = '<div class="leftcol">'
    + '<div class="topbar"><b>组牌</b><span class="dim">' + (我位 === null
        ? '单机：两组都能改'
        : '联机：你只能改 <b style="color:var(--accent)">' + (我位 === 0 ? '甲' : '乙') + '</b>') + '</span></div>'
    + '<div class="filters">'
    + '<div><label>搜索（名称／副类别）</label>'
    + '<input id="组牌搜索" value="' + esc(f.词) + '" placeholder="例如：黄巾、骑、领土" oninput="设筛选(\'词\',this.value)"></div>'
    + '<div><label>势力</label><div class="势力钮">'
    + '<button class="' + (f.势力 === '' ? 'on' : '') + '" onclick="设筛选(\'势力\',\'\')">全部</button>'
    + 势力们.map((x) => '<button class="' + (f.势力 === x ? 'on' : '') + '" onclick="' + 内联('设筛选', '势力', x) + '">' + x + '</button>').join('')
    + '</div></div>'
    + '<div><label>类别</label><div class="势力钮">'
    + '<button class="' + (f.类别 === '' ? 'on' : '') + '" onclick="设筛选(\'类别\',\'\')">全部</button>'
    + 类别们.map((x) => '<button class="' + (f.类别 === x ? 'on' : '') + '" onclick="' + 内联('设筛选', '类别', x) + '">' + x + '</button>').join('')
    + '</div></div>'
    + '<div><label>费用</label><select onchange="设筛选(\'费用\',this.value)">'
    + ['', '0', '1', '2', '3', '4', '5', '6', '7'].map((v) =>
        '<option value="' + v + '"' + (f.费用 === v ? ' selected' : '') + '>' + (v === '' ? '不限' : v + ' 费') + '</option>').join('')
    + '</select></div>'
    + '<div><label>基本／非基本</label><select onchange="设筛选(\'基本\',this.value)">'
    + [['', '不限'], ['基本', '只要基本'], ['非基本', '只要非基本']].map(([v, t]) =>
        '<option value="' + v + '"' + (f.基本 === v ? ' selected' : '') + '>' + t + '</option>').join('')
    + '</select></div>'
    + '<div class="dim">卡池 ' + 过的.length + ' / ' + p.卡池.length + ' 种'
    + (有筛选 ? '　<button class="次" style="padding:2px 6px" onclick="清筛选()">清筛选</button>' : '') + '</div>'
    + '</div></div>';

  const 中 = '<div class="deckmain">'
    + '<div class="deckwrap 单列"><div class="deckcol">'

    + '<b>' + 侧 + '</b> '
    + '<span class="dim">' + p[侧].length + ' 张' + (可改 ? '' : '　（只能看，不能改）') + '</span> '
    + (可改 ? '<button onclick="' + 内联('清空', 侧) + '">清空</button>'
             : '<span class="dim">（由对方编辑）</span>')
    + 校(p['校验' + 侧]) + 本组() + '</div></div>'
    + 卡池区(过的, 侧, 可改, 本组计数)
    + '</div>';

  const 右 = '<div class="side">'
    + '<div class="topbar">'

    + '<button onclick="document.getElementById(\'导入文件\').click()">导入 .cod</button>'
    + '<input id="导入文件" type="file" accept=".cod,.xml" style="display:none" onchange="导入套牌文件(this)">'
    + '<button onclick="切换组牌侧()">切换到 ' + (侧 === '甲' ? '乙' : '甲') + '</button>'

    + (可改 ? '<button onclick="保存牌组()">保存牌组</button>'
            : '<button disabled title="这一组是对方的，只能看">保存牌组</button>')
    + '<button class="' + (组牌.无限制 ? 'on' : '') + '" onclick="切换无限制()"'
    + ' title="测试用：跳过「同名≤3 张」和「主牌 50 张以上」两条构筑限制">无限制：' + (组牌.无限制 ? '开' : '关') + '</button>'
    + '<button class="次" onclick="组牌=null;render()">取消</button></div>'
    + '<div class="detail" id="组牌详情">' + 组牌详情() + '</div></div>';

  return '<div class="wrap 组牌wrap">' + 左 + 中 + 右 + '</div>';
}

function 组牌悬停到(id) { 组牌选 = id; 刷新组牌详情(); }

function 组牌点选(id) {
  组牌选 = id;
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;
  const 侧 = 组牌.侧;

  if (我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙')) 加牌(id);
  else 刷新组牌详情();
}

function 设筛选(键, 值) {
  组牌筛选[键] = 值;
  if (键 === '词' && 刷新卡池()) return;
  render();
}

function 刷新卡池() {
  const 标 = document.getElementById('组牌卡池标'), 网 = document.getElementById('组牌卡池');
  if (!标 || !网) return false;
  const p = 组牌;
  const 我位 = 状态 && 状态.我的座位 != null ? 状态.我的座位 : null;
  const 侧 = p.侧;
  const 可改 = 我位 === null || (我位 === 0 ? 侧 === '甲' : 侧 === '乙');
  const 过的 = 过筛排序卡池();
  const 本组计数 = p[侧].reduce((m, id) => { m[id] = (m[id] || 0) + 1; return m; }, {});
  标.innerHTML = '卡池——' + (可改 ? '点一下加进「' + 侧 + '」' : '只能看（这是对方那一组）')
    + '（<b id="组牌卡池数">' + 过的.length + '</b> 种）';
  网.innerHTML = 过的.length ? 过的.map((c) => 图块(c, 本组计数)).join('')
                            : '<span class="dim">（没有符合筛选的牌）</span>';
  return true;
}

function 清筛选() { 组牌筛选 = { 词: '', 势力: '', 类别: '', 费用: '', 基本: '' }; render(); }

function 组牌详情() {
  const c = 组牌 && 组牌选 ? 组牌.卡池.find((x) => x.id === 组牌选) : null;
  if (!c) return '<div class="dhead"><div class="dname">卡牌信息</div>'

    + '<div class="dbox"><span class="dim">（鼠标移到一张牌上）</span></div><div class="dtext">（未选中）</div>';
  const 类 = (c.超类别 || []).concat(c.类别 || [], c.副类别 || []).join('～') || '—';
  const 需 = Object.entries(c.需求 || {}).map(([k, v]) => '{' + k + '}' + v).join('');
  const 供 = Object.entries(c.支持 || {}).map(([k, v]) => '{' + k + '}' + v).join('');
  return '<div class="dhead"><div class="dname">' + esc(c.名称) + '</div>'
    + '<div class="dmeta">' + esc(类) + '　' + esc((c.势力 || []).join('/') || '中立')
    + (c.是单位 && c.武力 != null ? '　' + c.武力 + '/' + c.体力上限 : '')
    + '　费用 ' + c.费用 + (需 ? '　需求 ' + 需 : '') + (供 ? '　提供 ' + 供 : '')
    + '<br>' + esc(c.系列 + ' ' + c.编号) + (c.基本 ? '　【基本】' : '') + '</div></div>'
    + '<div class="dbox">' + (c.图 ? '<img src="' + c.图 + '" alt="' + esc(c.名称) + '">' : '<span class="dim">（无卡图）</span>') + '</div>'
    + '<div class="dtext">' + esc(c.文字 || '（无规则文字）') + '</div>';
}

function 刷新组牌详情() {

  if (el) el.innerHTML = 组牌详情();
}

let 视图 = [];
const 视图键 = (v) => v.区 + '|' + v.玩家;

function 开查看(区, 玩家) {
  const v = { 区, 玩家 };
  if (!视图.some((x) => 视图键(x) === 视图键(v))) 视图.push(v);
  render();
}

function 关视图(键) { 视图 = 视图.filter((v) => 视图键(v) !== 键); render(); }

let 布局 = '平';

function 切布局() {}

function 区域视图html(s, v) {

  const 是检视 = v.区 === '检视';
  const 名 = 是检视 ? '检视（效应让你看的牌）' : (v.区 === '放逐区' ? '放逐区' : s.players[v.玩家].名字 + ' 的' + v.区);

  const 需求候选卡 = (() => {
    const 需0 = 当前需求();

    return (((需0 && 需0.查看) || [])).filter((c) => c && c.卡).map((c) => c.卡);
  })();
  const 列表 = 是检视 ? 需求候选卡
    : v.区 === '墓地' ? s.players[v.玩家].墓地
    : v.区 === '放逐区' ? s.放逐区 : null;
  const 数 = 是检视 ? 需求候选卡.length : (v.区 === '牌库' ? s.players[v.玩家].牌库张数 : (列表 ? 列表.length : 0));

  const 注明 = 是检视 ? '401.5 / 检视效果：只有你看得到'

  let h = '<div class="viewer"><div class="vhead"><b>' + esc(名) + '</b>'
    + '<span class="dim">' + 数 + ' 张　' + 注明 + '</span><span class="spacer"></span>'

    + (选择 && 选择.候选 && 选择.候选.size ? '<b>点一张计入选择</b>' : '')
    + '<button onclick="' + 内联('关视图', 视图键(v)) + '">关闭</button></div><div class="vgrid">';
  if (v.区 === '牌库') {

    if (数 === 0) h += '<span class="dim">（空）</span>';
    else {
      h += '<div class="vrowlabel">牌库共 ' + 数 + ' 张（背面：你看不到内容）</div>';
      for (let k = 0; k < 数; k++) h += '<div class="cardback"></div>';
    }
  } else if (!列表 || 列表.length === 0) h += '<span class="dim">（空）</span>';

  else h += 列表.map((c) => {

    return '<span class="pickable' + 框类(c.uid, true) + '"'
      + ' onclick="' + 内联('点选', c.uid) + '">' + 卡 + '</span>';
  }).join('');
  return h + '</div></div>';
}

function 有人入座(s) { return (s.入座 || []).some((x) => x); }

function 需要大厅(s) { return !令牌 || s.未入座 || s.废弃 || (!s.热座 && (!s.人齐 || !!s.等准备)); }

function 同步日志(行, 原本贴底, 总数) {

  const 起始 = Math.max(0, (typeof 总数 === 'number' ? 总数 : 行.length) - 行.length);
  const 末尾 = 起始 + 行.length;
  const 空白 = el.innerHTML === '';
  if (空白 || 上次日志到 < 起始 || 上次日志到 > 末尾) {

    el.innerHTML = esc(行.join('\n'));
    上次日志到 = 末尾;
    if (原本贴底 || 空白) el.scrollTop = el.scrollHeight;
    return;
  }
  if (末尾 > 上次日志到) {
    el.insertAdjacentHTML('beforeend', (上次日志到 > 起始 ? '\n' : '') + esc(行.slice(上次日志到 - 起始).join('\n')));
    上次日志到 = 末尾;
  }
  if (原本贴底) el.scrollTop = el.scrollHeight;
}

const 设计宽 = 1280;
function 适配屏幕() {

  if (!document.body || !document.body.classList || !document.body.style ||
      typeof window.innerWidth !== 'number' || typeof window.innerHeight !== 'number') return;
  const 横 = window.innerWidth > window.innerHeight;

  const 缩 = 横 ? Math.min(1, Math.max(320, window.innerWidth) / 设计宽) : 1;

  document.documentElement.style.setProperty('--缩放', String(缩));
  document.body.style.zoom = 缩 === 1 ? '' : String(缩);
  document.body.classList.toggle('竖屏', !横);
}

function 铺区块(块) {
  const app = document.getElementById('app');
  const wrap = app && app.firstElementChild;
  if (!wrap || !wrap.classList.contains('wrap')) return false;

  for (const b of 块) {
    const el = wrap.querySelector(':scope > [data-块="' + b.名 + '"]');
    if (!el) return false;
    if (el.__html !== b.html) {
      el.outerHTML = b.html;

      const 新 = wrap.querySelector(':scope > [data-块="' + b.名 + '"]');
      if (新) 新.__html = b.html;
    }

    for (const 子 of (b.子 || [])) {
      const 子el = wrap.querySelector('[data-块="' + 子.名 + '"]');
      if (!子el) return false;
      if (子el.__html !== 子.html) {
        子el.outerHTML = 子.html;
        const 新子 = wrap.querySelector('[data-块="' + 子.名 + '"]');
        if (新子) 新子.__html = 子.html;
      }
    }
  }
  return true;
}

  let 文本 = '';
  try { 文本 = await f.text(); } catch (err) { 提示('读文件失败：' + err.message); return; }

  const 主区 = (文本.match(/<zone name="main">([\s\S]*?)<\/zone>/) || [])[1] ?? 文本;
  const 有 = new Set(组牌.卡池.map((c) => c.id));
  const ids = []; const 缺 = [];
  for (const m of 主区.matchAll(/<card number="(\d+)" name="([^"]+)"/g)) {
    const 数量 = Number(m[1]);
    const 原名 = m[2];
    const k = 原名.match(/^\[([^·]+)·([^\]]+)\](.*)$/);
    const id = k ? k[1] + '-' + k[2] : '';
    if (!id || !有.has(id)) { 缺.push(原名); continue; }
    for (let i = 0; i < 数量; i++) ids.push(id);
  }
  if (!ids.length) { 提示('这个文件里没有能认出来的主牌' + (缺.length ? '（' + 缺.slice(0, 5).join('、') + '…）' : '')); return; }
  组牌[组牌.侧] = ids;
  render();
  提示('已导入 ' + f.name + '：' + ids.length + ' 张' + (缺.length ? '，' + 缺.length + ' 种没认出来（' + 缺.slice(0, 3).join('、') + '…）' : '')
    + '　—— 正在保存到本房间');
  await 保存牌组();
}

async function 去组牌() {
  if (!令牌) await 热座();
  if (!令牌) return;
  await 打开组牌();
}

async function 离座() {

  const 开局了 = 状态 && 状态.turn > 0;
  if (开局了 && !confirm('对局进行中。离座后这个座位会被释放，对手会看到你掉线。\n确定要离座吗？')) return;
  await fetch('/api/离座', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ 令牌 }) });
  令牌 = ''; localStorage.removeItem('zmdj令牌'); 我 = null;
  if (事件源) { 事件源.close(); 事件源 = null; }
  开推送();
  await 刷新();
}

let 事件源 = null;
let 推送状态 = '未连';
let 推送收到 = 0;

function 开推送() {

  if (事件源) return;
  try {
    事件源 = new EventSource('/api/events' + (令牌 ? '?令牌=' + encodeURIComponent(令牌) : ''));
    事件源.onopen = () => { 推送状态 = '已连'; render(); };
    事件源.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);

        推送收到++;
        if (d.大厅) { 房间列表 = d.房间 || []; render(); return; }
        状态 = d;
        我 = 状态.我的座位;
        if (!待选 && !会话.模式) render();
      } catch {  }
    };

    事件源.onerror = () => { 推送状态 = '断开'; 上次状态串 = null; render(); };
  } catch { 事件源 = null; }
}

async function 刷新() {
  try {
    状态 = await (await fetch(带令('/api/state'))).json();
    我 = 状态.我的座位;
    if (!令牌 || !状态.人齐) await 载入房间列表();

    const 变了 = 状态串(状态) !== 上次状态串;
    if (变了 && !待选 && !会话.模式) render();
  } catch {}
}

(async () => {
  try {
    状态 = await (await fetch(带令('/api/state'))).json();
    我 = 状态.我的座位;
    await 载入房间列表();
    render();
    if (decodeURIComponent(location.search).indexOf('组牌') >= 0) await 打开组牌();

    const 查 = new URLSearchParams(location.search).get('查看');
    if (查) { const [区, 位] = 查.split(':'); 开查看(区, 位 == null ? -1 : Number(位)); }

    开推送();
    setInterval(刷新, 8000);

document.addEventListener('visibilitychange', () => { if (!document.hidden) 刷新(); });
  } catch (e) {
    document.getElementById('app').innerHTML = '<pre style="color:#e07070">载入失败：' + e
      + '\n\n如果你是用 file:// 直接打开的，请改用 http://127.0.0.1:8787</pre>';
  }
})();
</script>
